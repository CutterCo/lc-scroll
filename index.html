<style>
  /* Design tokens. Hex approximations of the design's oklch colours, so older
     browsers get the same values. */
  :root{
    --green-900:#1f3d32;  /* sidebar, top bar, bottom bar */
    --green-700:#2f5a49;  /* selection, shelf ledge, key line */
    --ok:#2f6e4e;         --ok-50:#e6f2ea;
    --err:#a8452f;        --err-50:#f9ebe6;
    --amber:#a6741c;
    --ink:#1b2a25;
    --cream:#f5f0e6;      --cream-muted:#cbd0b8;
    --paper:#f8f4ec;      --line:#e2dacb;
    --marigold:#ecc24a;   /* the highlighter */
    --marigold-tint:#fbf1d2; --marigold-hover:#f2dc8e;
    --text-2:#3d3a35;     --text-3:#5b5852;
    --serif:"Literata", Georgia, "Times New Roman", serif;
    --sans:"Hyperreadable", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --mono:"Courier Prime", "Courier New", ui-monospace, Menlo, Consolas, monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:var(--sans); font-size:18px; line-height:1.55;
    color:var(--ink); background:var(--paper);
  }
  body.drawer-open{ overflow:hidden; }
  .skip{
    position:absolute; left:-999px; top:0; background:#fff; padding:8px 12px; z-index:40;
  }
  .skip:focus{ left:8px; top:8px; }
  :focus-visible{ outline:2px solid #0f3a26; outline-offset:3px; }   /* keyboard focus only */
  .sidebar :focus-visible, .topbar :focus-visible, .bottombar :focus-visible,
  .drawer-panel :focus-visible{ outline-color:var(--marigold); }
  .sr, .live{
    position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);
    white-space:nowrap;
  }

  /* ----- Shell: sidebar ≥1100px; top bar + drawer below that. The layout
     is never narrower than 768px: smaller screens (phones, high zoom) scroll
     sideways instead of being blocked ----- */
  .app{ display:flex; min-height:100vh; }
  @media screen{ .app{ min-width:768px; } }   /* screen only: paper is narrower */
  .app-main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  /* One frame for every screen, so the content's left edge never moves; reading
     screens (intro, lessons) keep a narrower measure inside it, from the left */
  main{ flex:1; width:100%; max-width:916px; margin:0 auto; padding:32px 28px 48px; }
  :where(main.narrow) > *{ max-width:720px; }
  .sidebar{
    display:none; flex-direction:column; flex:none; width:248px;
    position:sticky; top:0; height:100vh; overflow-y:auto;
    background:var(--green-900); color:var(--cream); padding:24px 20px; font-size:15px; line-height:1.5;
  }
  .side-title{ margin:0; padding-bottom:22px; font:600 19px/1.25 var(--serif); }
  /* This copy is an experiment: a quiet note under the title, linking to the original */
  .side-note{ margin:-10px 0 22px; padding:8px 10px; font-size:13px; line-height:1.45; color:var(--cream-muted);
              border:1px dashed rgba(255,255,255,.3); border-radius:6px; }
  .side-note a{ color:var(--cream); text-underline-offset:2px; }
  .outline{ list-style:none; margin:0; padding:0; }
  .outline li{ display:grid; grid-template-columns:22px 1fr; column-gap:12px; }
  .ol-mark{ display:flex; flex-direction:column; align-items:center; }
  .ol-dot{ flex:none; width:12px; height:12px; margin-top:5px; border-radius:50%;
           border:2px solid var(--cream-muted); }
  .ol-conn{ flex:1; width:2px; min-height:18px; background:rgba(255,255,255,.25); }
  .outline li:last-child .ol-conn{ display:none; }
  .ol-lock{ flex:none; margin-top:4px; color:#a9b8ae; }   /* locked item */
  .outline li.done .ol-dot{ background:var(--cream); border-color:var(--cream); }
  .outline li.done .ol-conn{ background:var(--cream); }
  .outline li.now .ol-dot{ width:18px; height:18px; margin-top:2px; border:0;
                           background:var(--marigold); box-shadow:0 0 0 4px rgba(255,255,255,.12); }
  .ol-item{
    display:block; width:100%; min-height:40px; margin:-8px 0 4px -10px; padding:8px 10px;
    font:inherit; text-align:left; color:inherit; background:none; border:0; border-radius:6px;
  }
  button.ol-item{ cursor:pointer; }
  button.ol-item:hover{ background:rgba(255,255,255,.06); }
  li.done .ol-item{ color:var(--cream-muted); }
  li.now .ol-item{ font-weight:700; color:var(--cream); background:rgba(255,255,255,.09); }
  .ol-sub{ display:block; font-weight:400; font-size:13px; color:var(--cream-muted); }
  .ol-kicker{ display:block; font-size:13px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
              color:var(--cream-muted); }
  .side-foot{ margin-top:auto; display:flex; flex-direction:column; gap:10px; padding-top:18px;
              border-top:1px solid rgba(255,255,255,.18); }
  .side-btns{ display:flex; flex-wrap:wrap; gap:8px; }
  .side-btns > *{ flex:1 1 auto; }   /* a long Back label takes its own row */
  button.btn-cream{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    min-height:48px; padding:0 14px; border:0; border-radius:8px;
    background:var(--cream); color:var(--ink); box-shadow:0 2px 0 #142a21; font-size:15px;
  }
  button.btn-cream:disabled{ background:rgba(255,255,255,.18); color:var(--cream-muted); box-shadow:none; }
  .topbar{ background:var(--green-900); color:var(--cream); padding:14px 28px 16px; }
  /* Outline first, on the drawer's side: still in view when a zoomed page scrolls sideways */
  .tb-row{ display:flex; align-items:center; gap:16px; }
  .tb-meta{ margin:0; font-size:15px; color:var(--cream-muted); }
  .strip{ display:flex; gap:4px; margin-top:14px; }
  .strip span{ flex:1; height:6px; border-radius:3px; background:rgba(255,255,255,.22); }
  .strip .done{ background:var(--cream); }
  .strip .now{ background:var(--marigold); }
  .bottombar{
    position:sticky; bottom:0; z-index:5; display:flex; gap:12px;   /* Back, as in the sidebar */
    background:var(--green-900); padding:14px 28px;
  }
  .bottombar:empty{ display:none; }
  /* Keep a focused control clear of the sticky bottom bar when the page scrolls to it */
  @media (max-width:1099px){ html{ scroll-padding-bottom:92px; } }
  /* Short screens (a landscape tablet): Back joins Outline in a tighter
     top bar and the sticky bottom bar goes, so it never covers feedback or Submit */
  .tb-btns{ display:none; gap:8px; }
  @media (max-width:1099px) and (max-height:800px){
    .topbar{ padding:10px 28px 12px; }
    .strip{ margin-top:10px; }
    .tb-btns{ display:flex; }
    .bottombar{ display:none; }
    html{ scroll-padding-bottom:0; }
    main{ padding-top:20px; }
    main > .card:first-child{ margin-top:0; }
  }
  .drawer{ position:fixed; inset:0; z-index:30; }
  .drawer[hidden]{ display:none; }
  .scrim{ position:absolute; inset:0; background:rgba(10,20,15,.5); }
  .drawer-panel{
    position:absolute; top:0; left:0; bottom:0; width:320px; max-width:90vw; overflow-y:auto;
    display:flex; flex-direction:column; padding:24px 20px;
    background:var(--green-900); color:var(--cream); font-size:15px; line-height:1.5;
  }
  #drawer-body{ flex:1; display:flex; flex-direction:column; }
  @media (min-width:1100px){
    .sidebar{ display:flex; }
    .topbar, .bottombar, .drawer{ display:none !important; }
    main{ padding:32px 40px 64px; max-width:940px; }
  }

  /* ----- Content ----- */
  main h1{ margin:0 0 20px; font:600 36px/1.15 var(--serif); letter-spacing:-.01em; }
  main h2{ margin:28px 0 10px; font:600 21px/1.25 var(--serif); }
  @media (max-width:1099px){ main h1{ font-size:34px; } }
  .meta{ margin:0 0 8px; font-size:14px; font-weight:700; color:var(--text-3); }
  .lede{ margin-top:0; color:var(--text-2); }
  code{ font-family:var(--mono); font-weight:700; font-size:.95em; }
  /* Buttons: secondary by default (transparent, 1.5px border ≥3:1 on cream);
     primary solid. Submit is greyed with aria-disabled but stays focusable. */
  button{
    font:inherit; font-size:16px; font-weight:700; color:var(--ink); cursor:pointer;
    min-height:48px; padding:0 20px; border-radius:8px;
    border:1.5px solid #8a8373; background:transparent;
    /* Touch: a long press is a tap, never a text selection or callout */
    -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; touch-action:manipulation;
  }
  button:where(:not(.primary, .pick, .book, .gap, .opt, .ol-item, .btn-cream)):hover:not(:disabled){ background:#efe9dd; }
  button.primary{ background:#13201a; border-color:#13201a; color:#fff; }
  button.primary:hover:not(:disabled):not([aria-disabled="true"]){ background:#24352c; border-color:#24352c; }
  button:disabled, button[aria-disabled="true"], button.primary[aria-disabled="true"]{
    background:#ebe9e4; border-color:#ebe9e4; color:var(--text-3); cursor:not-allowed; }
  .bar{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; margin-top:18px; }
  .bar.start{ justify-content:flex-start; gap:16px; }
  .partlabel{ font-size:14px; color:var(--text-3); }
  /* Active panel: the card the learner is working in */
  .card{
    background:#fff; border:1px solid var(--line); border-top:5px solid var(--marigold);
    border-radius:10px; padding:24px; margin-top:24px; box-shadow:0 2px 10px rgba(40,30,10,.06);
  }
  .card > h2:first-child{ margin-top:0; }
  main h2.meta{ margin:0 0 14px; font:700 14px/1.4 var(--sans); color:var(--text-3); }
  .picks{ margin-top:4px; }
  @media (max-width:1099px){ .card{ padding:22px 20px; } }
  .prompt{ margin:0 0 4px; font:600 21px/1.35 var(--serif); }
  #practice-head{ margin:0 0 22px; font-size:27px; }
  .sub{ margin:0; font-size:15px; color:var(--text-3); }
  [hidden]{ display:none !important; }
  /* Feedback: an ink stamp above the action row. The heading word carries the
     verdict (uppercased by CSS, so it is read as a word); no icon, no fill */
  .stamp{
    --stamp-ink:var(--ok);
    display:flex; flex-direction:column; gap:6px;
    margin:20px 6px 6px; padding:16px 20px;
    border:3px solid var(--stamp-ink); outline:1.5px solid var(--stamp-ink); outline-offset:4px;
    border-radius:0; background:transparent;
  }
  /* "Not quite" is quieter than "Shelved": the same box, only the thin outer line */
  .stamp--incorrect{ --stamp-ink:var(--err); border-color:transparent; }
  .stamp p{ margin:0; }
  .stamp-head{ font:700 18px/1.3 var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--stamp-ink); }
  .stamp-body, .note-body{ font-size:16px; line-height:1.5; color:#1a1f1c; text-wrap:pretty; }
  /* Hint, and the last answer once it has been changed: plain blocks, no frame */
  .note{ display:flex; flex-direction:column; gap:4px; margin-top:18px; }
  .note p{ margin:0; }
  .note-head{ font:700 15px/1.3 var(--mono); letter-spacing:.14em; text-transform:uppercase; color:#6b665c; }
  /* Action row: Previous, Hint and the shelf tools left; Submit or the way on right */
  .actions{ display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-top:18px; }
  .act-l, .act-r{ display:flex; flex-wrap:wrap; gap:10px; }
  .act-r{ margin-left:auto; }
  .nav-l, .nav-r{ display:contents; }
  .actions button{ flex:none; white-space:nowrap; }
  .hint-btn[aria-expanded="true"]{ box-shadow:inset 0 0 0 2px var(--ink); }   /* pressed: reads as on */
  /* Results: one formative summary card */
  .card.results{ max-width:760px; margin:0; padding:26px 32px; border-top-width:4px; }
  .results > * + *{ margin-top:22px; }
  /* The close, a short summary, then the score as the results' heading; the
     summary sits an even 22px from each */
  .results h1{ margin:4px 0 2px; font:600 30px/1.2 var(--serif); }
  .r-lede{ margin:0; color:var(--text-2); }
  .r-summary .r-lede + .r-lede{ margin-top:10px; }
  /* Running text keeps a readable measure; the bands and tables span the card */
  .r-lede, .r-hints, .r-shift p{ max-width:34em; text-wrap:pretty; }
  main .r-score{ margin:22px 0 0; font:600 23px/1.3 var(--serif); }
  .r-score + .r-review{ margin-top:14px; }
  .r-print-who{ display:none; }   /* the printout's name and date line */
  /* Review box: a tinted band across the card, not a box inside it. The
     transparent borders show in forced colours, where the tint is dropped */
  .r-review{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px 20px;
    margin-inline:-32px; padding:20px 32px; background:#fbf3dc; border-block:1px solid transparent; }
  .r-review.clear{ background:var(--ok-50); }
  .r-eyebrow{ margin:0; font:700 13px/1.55 var(--sans); letter-spacing:.06em; text-transform:uppercase; color:#5a4a1c; }
  .r-review.clear .r-eyebrow{ color:var(--ok); }
  .r-review-line{ margin:2px 0 0; font:700 21px/1.3 var(--serif); }
  .r-review > div{ flex:1 1 320px; }
  .r-why{ margin:4px 0 0; font-size:16px; line-height:1.7; color:#4a3d17; }
  /* Question links: inline, with a padded hit area for touch. The line-height
     is just enough to keep the hit areas of wrapped links from overlapping */
  button.link{ min-height:0; padding:4px; margin:-4px; border:0; border-radius:4px; background:none;
               font:inherit; line-height:1.55; font-weight:700; color:var(--green-700); text-decoration:underline; text-underline-offset:3px; }
  button.link:hover{ color:var(--ink); background:none; }
  .r-cols{ display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:8px 32px; }
  .r-table{ width:100%; border-collapse:collapse; }
  main .r-col-h{ margin:0; padding:0 0 6px; font:600 19px/1.3 var(--serif); }
  .r-table th, .r-table td{ text-align:left; vertical-align:top; padding:10px 0; min-height:44px; border-top:1px solid #ece6da; }
  .r-table th{ font-weight:700; }
  .r-table td{ text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; padding-left:12px; }
  .r-table td.r-full{ color:#1f6b47; font-weight:600; }
  .r-table td.r-part{ color:var(--ink); font-weight:700; }   /* not a warning: the review box names the weak line */
  .r-sub{ display:block; font-size:14px; font-weight:400; color:var(--text-3); }
  .r-note{ margin:6px 0 0; font-size:14px; color:var(--text-3); }
  .r-hints{ margin-bottom:0; }
  /* Before your first shift: plain heading and text, set apart from the review box */
  .r-shift{ padding-top:18px; border-top:1px solid var(--line); }
  .r-shift h2{ margin:0; font:600 19px/1.3 var(--serif); }   /* as the By skill / By line headings */
  .r-shift p{ margin:4px 0 0; }
  /* Printing: the name, the review sheet box, then Print, with Start over at the far right */
  .r-print{ display:flex; flex-direction:column; align-items:flex-start; gap:12px; padding-top:18px; border-top:1px solid var(--line); }
  .r-who{ display:flex; flex-direction:column; gap:4px; width:280px; max-width:100%; font-size:15px; }
  .r-who label{ font-weight:700; }
  .results input[type="text"]{ font:inherit; font-size:16px; color:var(--ink); background:#fff;
    border:1.5px solid #8a8373; border-radius:6px; padding:6px 10px; min-height:44px; }
  .r-check{ display:flex; align-items:center; gap:10px; min-height:44px; font-size:16px; cursor:pointer; }
  .r-check input{ flex:none; width:22px; height:22px; margin:0; accent-color:var(--green-700); }
  .r-actions{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px 16px; align-self:stretch; }
  .r-confirm{ flex:1; }
  /* Review sheet: printed as a second page when its box is ticked; not shown on screen */
  .r-sheet{ display:none; }
  .r-sheet h2{ margin:0; font:600 26px/1.2 var(--serif); }
  .r-sheet .r-lede{ margin:6px 0 16px; }
  .r-sheet-row{ display:flex; flex-wrap:wrap; align-items:flex-start; gap:20px 32px; }
  .r-sheet-row .stage{ margin:0; }
  .r-sheet-list{ flex:1 1 300px; margin:0; padding-left:1.4em; }
  .r-sheet-list li:not(:first-child){ margin-top:8px; }
  .r-sheet-list li{ line-height:1.45; color:var(--text-2); }
  .r-sheet-list li::marker{ font-weight:700; color:var(--ink); }
  .r-sheet-list b{ color:var(--ink); }
  .r-sheet-rule{ display:block; }
  .r-confirm p{ margin:0 0 10px; }
  .r-confirm .bar{ margin-top:0; }
  button.danger{ border-color:#9a3a24; color:#9a3a24; }
  button.danger:hover:not(:disabled){ background:var(--err-50); }
  @media print{
    .sidebar, .topbar, .bottombar, .drawer, .skip, .r-print, .r-review > button{ display:none !important; }
    .r-why button.link{ color:inherit; text-decoration:none; }
    body{ background:#fff; }
    .app{ min-height:0; }   /* a full-height shell spills onto a blank second page */
    main{ max-width:none; padding:0; }
    .card.results{ max-width:none; box-shadow:none; margin:0; }
    /* The printout starts with the name and the score; the close and the shift
       advice are for the screen, and leaving them off keeps the results to one page */
    .results > h1, .r-summary, .r-shift{ display:none; }
    .r-print-who{ display:flex; justify-content:space-between; gap:24px; margin:0; padding-bottom:6px;
      border-bottom:1px solid var(--ink); font-size:18px; font-weight:700; }
    #r-print-name:not(:empty)::before{ content:" \2014  "; }
    .r-print-date{ flex:none; white-space:nowrap; font-weight:400; color:var(--text-3); }
    main .r-score{ margin-top:14px; font-size:26px; }
    .r-cols{ grid-template-columns:1fr 1fr; }   /* side by side at any page margin */
    /* The review sheet follows its box, whichever way printing starts (button, Ctrl+P, Share > Print) */
    body:has(#r-sheet-on:checked) .r-sheet{ display:block; break-before:page; }
  }

  /* ----- Spine labels: one stack, consistent everywhere (dotless) ----- */
  .spine{
    color:var(--ink);   /* inside a disabled button too */
    display:inline-flex; flex-direction:column; align-items:center;
    font-family:var(--mono); font-weight:700; font-size:18px; letter-spacing:.02em;
    background:#fff; border:2px solid var(--ink); border-radius:3px; padding:8px 10px;
    box-shadow:3px 3px 0 rgba(31,61,50,.18);
  }
  .spine .spine-line{ display:block; line-height:26px; min-height:26px; padding:0 4px; border-radius:2px; }
  .pair{ display:flex; flex-wrap:wrap; gap:16px; margin:12px 0; }
  /* ----- Module steps: every step on one page, numbered, each with its own picture ----- */
  .part{ display:grid; grid-template-columns:26px 1fr; column-gap:12px;
         padding:20px 0 22px; border-top:1px solid var(--line); }
  .part:first-of-type{ border-top:0; padding-top:0; }
  .part-n{ width:26px; height:26px; margin-top:2px; border-radius:50%; background:var(--ink); color:#fff;
           display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; }
  .caption{ margin:0; }
  .part-body{ min-width:0; }
  .part-body .stage{ margin:14px 0 0; }
  .stage .sweep-btn{ align-self:center; min-height:44px; padding:0 14px; font-size:15px; }
  #view:focus, #view h1:focus, .caption:focus, #practice-head:focus{ outline:none; }  /* programmatic focus targets */
  #practice-head{ scroll-margin-top:16px; }
  .stage{
    display:flex; flex-wrap:wrap; gap:24px; align-items:flex-start;
    width:fit-content; max-width:100%; margin:4px 0 6px; padding:16px 18px;
    background:#fff; border:1px solid var(--line); border-radius:8px;
  }
  .stage .spine{ font-size:22px; padding:10px 14px; }
  .stage .spine .spine-line{ line-height:30px; min-height:30px; }
  /* The highlighter: marigold plus an outline, never colour alone */
  .spine-line.lit, .spine-line .lit{ background:var(--marigold); color:var(--ink);
                                     box-shadow:inset 0 0 0 2px var(--amber); }
  .spine-line .lit{ border-radius:2px; padding:0 2px; }
  .spine-line.dim{ color:var(--text-3); }   /* solid grey, not opacity: still 7:1 on white */
  /* Line key beside the first spine (the design's "featured label") */
  .spine-wrap{ display:inline-flex; align-items:flex-start; }
  .spine-labels{ display:flex; flex-direction:column; align-items:flex-end; padding-top:12px; }
  .spine-labels .key{ display:flex; align-items:center; justify-content:flex-end; gap:10px;
                      height:30px; font-size:15px; color:var(--text-3); white-space:nowrap; }
  .key .conn{ width:32px; height:1.5px; background:var(--line); }
  .key.lit{ color:var(--ink); font-weight:700; }
  .key.lit .conn{ height:2px; background:var(--green-700); }
  .key.empty .conn{ visibility:hidden; }
  /* Untaught lines: blank bars keep the label's shape without the content */
  .spine-line.blank{ display:flex; align-items:center; justify-content:center; }
  .spine-line.none{ width:calc(4ch + 8px); margin:0 auto; border:2px dashed var(--ink); }   /* a year's width */
  .spine-line.none.cutter{ width:calc(2ch + 8px); }   /* a short Cutter's width */
  .spine-line.none.lit{ background:var(--marigold-tint); }
  .blank-bar{ display:inline-block; height:10px; border-radius:5px; background:#ddd5c5; }
  /* Module 0 drawings */
  .visual{ max-width:100%; height:auto; }
  .word-demo{ display:flex; flex-direction:column; gap:10px; }
  .word-row{ display:flex; align-items:center; gap:4px; }
  .word-n{ width:28px; font-weight:700; font-size:16px; color:var(--text-3); }
  .wl{ display:inline-flex; align-items:center; justify-content:center; width:34px; height:42px;
       font:700 28px var(--mono); color:var(--ink); background:#fff; border:2px solid var(--line); border-radius:3px; }
  .wl.dim{ color:var(--text-3); }   /* fades the letter, not its box */
  .wl.lit{ background:var(--marigold); border-color:var(--ink); }
  .wl.gap{ background:var(--marigold-tint); border-style:dashed; }
  .shelf-demo{ display:flex; flex-direction:column; gap:14px; }
  .shelf-row{ display:flex; gap:8px; align-items:flex-end; padding:0 6px;
              border-bottom:8px solid var(--green-700); border-radius:0 0 2px 2px; }
  .mini-book{ display:flex; flex-direction:column; align-items:center; gap:4px;
              background:var(--green-900); border-radius:4px 4px 0 0; padding:8px 6px 10px; }
  .mini-book:nth-child(2){ background:#6b4f3a; } .mini-book:nth-child(3){ background:#45607a; }
  .mini-n{ color:#fff; font-weight:700; font-size:14px; }
  .mini-book .spine{ font-size:12px; padding:3px 5px; border-width:1px; box-shadow:none; }
  .mini-book .spine .spine-line{ line-height:15px; min-height:15px; padding:0 2px; }
  /* M0 "read top-down" sweep, played on demand (the step's button reads "Show me" first) */
  @keyframes pulse{ 0%,100%{ background:transparent; } 35%,65%{ background:var(--marigold); } }
  .spine.sweep.play .spine-line{ animation:pulse 1s ease both; }
  .spine.sweep.play .spine-line:nth-child(1){ animation-delay:0.1s; }
  .spine.sweep.play .spine-line:nth-child(2){ animation-delay:0.8s; }
  .spine.sweep.play .spine-line:nth-child(3){ animation-delay:1.5s; }
  .spine.sweep.play .spine-line:nth-child(4){ animation-delay:2.2s; }
  .spine.sweep.play .spine-line:nth-child(5){ animation-delay:2.9s; }
  /* Practice: the spine itself is the answer button */
  button.pick{
    display:inline-flex; flex-direction:column; align-items:center; gap:4px;
    min-height:0; padding:8px 6px; background:transparent; border:0; border-radius:10px;
    transition:transform .15s ease;
  }
  button.pick:hover .spine{ border-color:var(--green-700); }
  button.pick.selected{ transform:translateY(-4px); }
  button.pick.selected .spine{ border-color:#13201a; box-shadow:0 0 0 3px #13201a; }   /* dark ring, not marigold */
  button.pick:disabled{ cursor:default; }
  button.pick .badge{ min-height:22px; font-size:14px; font-weight:700; color:var(--ink); }
  /* ----- Tests: one question card at a time ----- */
  .q-head{ display:flex; align-items:center; justify-content:space-between; gap:16px; margin:0 0 14px; }
  main .q-head p.meta{ margin:0; font-size:14px; }
  main .q-head p.meta:focus{ outline:none; }
  main .q-head h3.meta{ margin:0; font:700 14px/1.4 var(--sans); color:var(--text-3); }
  main .q-head h3.meta:focus{ outline:none; }
  .q-bars{ display:flex; align-items:center; gap:6px; }
  .q-right{ display:flex; align-items:center; gap:14px; }
  .q-score{ font-size:14px; font-weight:700; color:var(--text-2); white-space:nowrap; }   /* once the test is done */
  /* Compact test card + intro card: fits a 13" laptop at 1080p without scrolling */
  .card.compact{ max-width:680px; padding:22px 28px; }
  .card.compact.wide-card{ max-width:none; }   /* Tests 2–3: the shelf row needs the width */
  .compact h1.prompt{ margin:0 0 2px; font:600 24px/1.3 var(--serif); }
  .compact .stage{ padding:14px 20px; }
  .compact .stage .spine{ font-size:17px; padding:8px 12px; }
  .compact .stage .spine .spine-line{ line-height:25px; min-height:25px; }
  .compact .spine-labels{ padding-top:10px; }
  .compact .spine-labels .key{ height:25px; font-size:14px; }
  .uniform.compact .stage .spine{
    width:calc(var(--cn-chars) * (1ch + .02em) + 40px); height:calc(var(--cn-lines) * 25px + 20px); }
  .compact .opts{ gap:8px; max-width:420px; margin-top:14px; }
  .compact button.opt{ min-height:46px; }
  .compact .bar{ margin-top:14px; }
  .t-intro{ display:flex; flex-direction:column; }
  .t-intro h1{ margin:4px 0 6px; font:600 32px/1.2 var(--serif); }
  .t-intro h1:focus{ outline:none; }
  .t-task{ margin:0 0 18px; }
  .t-facts{ margin:0 0 22px; padding:14px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line);
            display:grid; gap:8px; }
  .t-facts div{ display:grid; grid-template-columns:90px 1fr; gap:12px; }
  .t-facts dt{ font-weight:700; }
  .t-facts dd{ margin:0; }
  /* Start screen: the example label beside the purpose, facts and Start; the rest folds away */
  .intro-hero{ display:grid; grid-template-columns:minmax(0, 1fr) auto; column-gap:48px; align-items:center; }
  .intro-lede{ margin:0 0 22px; color:var(--text-2); max-width:62ch; }
  .intro-facts div{ grid-template-columns:104px 1fr; }
  .intro-facts{ margin-bottom:24px; }
  .intro-los{ max-width:68ch; }
  .intro-los h2{ margin-top:0; }
  .intro-los p{ margin:0; }
  .intro-los ol{ margin:6px 0 0; }
  .intro-figure{ margin:0; padding-right:8px; }
  .intro-figure .spine{ font-size:30px; padding:16px 22px; box-shadow:5px 5px 0 rgba(31,61,50,.18); }
  .intro-figure .spine .spine-line{ line-height:44px; min-height:44px; }
  .intro-more{ max-width:68ch; margin-top:40px; border-top:1px solid var(--line); }
  .intro-more details{ border-bottom:1px solid var(--line); }
  .intro-more summary{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    min-height:52px; padding:4px 4px; cursor:pointer; list-style:none;
    font:600 19px/1.3 var(--serif);
  }
  .intro-more summary::-webkit-details-marker{ display:none; }
  .intro-more summary::after{      /* chevron: points down when closed, up when open */
    content:""; flex:none; width:9px; height:9px; margin:-4px 6px 0 0;
    border-right:2px solid var(--ink); border-bottom:2px solid var(--ink); transform:rotate(45deg);
  }
  .intro-more details[open] > summary::after{ margin-top:4px; transform:rotate(-135deg); }
  .intro-more summary:hover{ background:#efe9dd; }
  .intro-more details > :not(summary){ margin-left:4px; margin-right:4px; }
  .intro-more details > p{ margin-top:4px; }
  .intro-more details > :last-child{ margin-bottom:20px; }
  /* Shape as well as colour: upcoming = thin line, first try = solid,
     not first try = hollow outline, current = solid ink */
  .q-bars span{ width:28px; height:2px; border-radius:1px; background:#8a8373; }
  .q-bars .first, .q-bars .help, .q-bars .now, .q-bars.plain .done{ height:6px; border-radius:3px; }
  .q-bars .first{ background:var(--ok); }
  .q-bars .help{ background:transparent; box-shadow:inset 0 0 0 2px var(--amber); }
  .q-bars.plain .done{ background:#8a8373; }   /* unscored practice: done / current only */
  .p-card .q-head{ margin-top:6px; }
  .q-bars .now{ background:var(--ink); }
  .question .stage{ margin-top:14px; }
  /* Test 1 answer options: a radio group styled like the lesson picks; one column,
     top to bottom in call-number line order */
  .opts{ display:grid; gap:10px; max-width:360px; margin-top:18px; }
  button.opt{ display:flex; align-items:center; gap:12px; min-height:56px; padding:0 16px;
              text-align:left; border:2px solid var(--line); background:#fff; }
  button.opt:hover{ border-color:var(--green-700); }
  /* Test 2: the book to shelve, then one shelf row with gaps between the books */
  .cart{ display:flex; align-items:center; gap:18px; margin:16px 0 18px; }
  .cart-title{ margin:0; font-weight:700; }
  .cart-status{ margin:2px 0 0; font-size:16px; color:var(--text-2); }
  button.book{ display:flex; align-items:flex-end; min-height:0; padding:6px 0; background:transparent;
               border:0; border-radius:8px; transition:transform .15s ease, opacity .2s ease; }
  button.book:hover .spine{ border-color:var(--green-700); }
  button.book.selected{ transform:translateY(-4px); }
  button.book.selected .spine{ border-color:#13201a; box-shadow:0 0 0 3px #13201a; }   /* dark ring, not marigold */
  button.book.away{ opacity:.65; }   /* on the shelf: a faded, dashed copy stays in the cart */
  button.book.away .spine{ border-style:dashed; box-shadow:none; }
  button.book:disabled{ background:transparent; cursor:default; }
  button.book.correct .spine{ border-color:var(--ok); box-shadow:0 0 0 2px var(--ok); }
  .shelf2{ display:flex; justify-content:space-between; align-items:stretch; gap:6px;
           padding:16px 14px 10px; background:var(--paper); border-radius:8px 8px 3px 3px;
           border-bottom:8px solid var(--green-700); overflow-x:auto; }
  .shelf2 > *{ flex:none; }   /* full-size books and gaps; the row scrolls instead of squeezing */
  /* Test 2 scroll cue: the edge fades on whichever side has more shelf (edgeCue) */
  .shelf-scroll{ position:relative; }
  .shelf-scroll > .shelf2{ scroll-padding-inline:48px; scrollbar-width:thin; scrollbar-color:#b9b2a3 transparent; }
  .shelf-scroll::before, .shelf-scroll::after{
    content:""; position:absolute; top:0; bottom:8px; width:48px; z-index:1; pointer-events:none;
    opacity:0; transition:opacity .2s ease; }
  .shelf-scroll::before{ left:0; border-radius:8px 0 0 0; background:linear-gradient(to right, var(--paper), rgba(248,244,236,0)); }
  .shelf-scroll::after{ right:0; border-radius:0 8px 0 0; background:linear-gradient(to left, var(--paper), rgba(248,244,236,0)); }
  .shelf-scroll.more-l::before, .shelf-scroll.more-r::after{ opacity:1; }
  .shelf2 .spine, .cart .spine, .tray3 .spine{ font-size:16px; padding:6px 8px; }
  .shelf2 .spine .spine-line, .cart .spine .spine-line, .tray3 .spine .spine-line{ line-height:22px; min-height:22px; }
  /* Uniform size: every label shown together, and every gap, gets the same box —
     as tall as the longest call number (--cn-lines), as wide as its widest line (--cn-chars).
     Width = characters × (1ch + letter-spacing) + padding, line padding, border, slack. */
  .uniform .shelf2 .spine, .uniform .cart .spine, .uniform .tray3 .spine, .uniform button.gap{
    width:calc(var(--cn-chars) * (1ch + .02em) + 32px); height:calc(var(--cn-lines) * 22px + 16px); }
  .uniform .stage .spine{
    width:calc(var(--cn-chars) * (1ch + .02em) + 44px); height:calc(var(--cn-lines) * 30px + 24px); }
  /* Test 2: tighter spacing and half-book slots, so four books fit a tablet; a
     placed book takes a full book's width. Long call numbers also get trimmed labels */
  .shelf2:not(.slots){ gap:4px; padding-left:8px; padding-right:8px; }
  .uniform .shelf2:not(.slots) button.gap{ width:48px; }
  .trim .shelf2 .spine, .trim .cart .spine{ padding-left:4px; padding-right:4px; }
  .trim .shelf2 .spine .spine-line, .trim .cart .spine .spine-line{ padding:0 2px; }
  .uniform.trim .shelf2 .spine, .uniform.trim .cart .spine{ width:calc(var(--cn-chars) * (1ch + .02em) + 20px); }
  .shelved{ display:flex; align-items:flex-end; padding:6px 0; }
  button.gap{ flex:none; align-self:flex-end; margin:6px 0; min-height:0; padding:0;
              border:2px dashed #8a8373; border-radius:4px; background:transparent; color:var(--green-700);
              font:700 16px var(--mono); letter-spacing:.02em; }   /* mono, so 1ch matches the labels */
  button.gap.ready{ border-color:var(--green-700); background:var(--marigold-tint); }
  button.gap.ready:hover{ background:var(--marigold-hover); }
  button.gap:disabled{ background:transparent; border-color:var(--line); cursor:default; }
  /* Test 3: tray row above a row of numbered slots; columns line up, centred in

function cmpNum(a, b){

    if (a.extra[i] === undefined) return -1;    // ties above, ran out first

/* ---------- State (persists locally, restart clears) ---------- */
const STORE_KEY = "lctut-scroll-v1";
const VIEWS = ["intro","m0","m1","m2","m3","m4","m5","t1","t2","t3","results"];
const modById = id => MODULES.find(m => m.id === id);
const testById = id => TESTS.find(t => t.id === id);

let state = null;
/* The name for the printout is kept in memory only, never saved: on a
   shared tablet or workstation it is gone once the page is reloaded */
let printoutName = "";

/* Saved state:
     view     the screen showing (one of VIEWS)
     q[qid]   one record per answered question, lessons and tests:
              { first: right on the first submit (true / false; null before),
                hints: 0 or 1, opened before the first submit,
                attempts: submits so far,
                last: the last submitted answer, redrawn on return,
                pairs: Test 3 only, each designated pair's first-submit result }
     reveal[moduleId]  0 = steps only; steps.length = practice showing
                       (introduction: steps.length - 1 = its Next selected)
     tq[testId]        test question showing
     pq[moduleId]      practice question showing
     started[testId]   past the test's intro card
     warm[testId]      the test's warm-up done or skipped */
function freshState(){
  return { view:"intro", q:{}, reveal:{}, tq:{}, started:{}, pq:{}, warm:{} };
}
/* Saved data may be old or damaged: keep only what has the expected shape,
   so a bad save can never leave the page without a screen to show */
const isObj = v => !!v && typeof v === "object" && !Array.isArray(v);
const QUESTION_BY_ID = new Map([...MODULES.flatMap(m => m.practice), ...TESTS.flatMap(t => t.questions)]
  .map(q => [q.id, q]));
const intMap = m => Object.fromEntries(Object.entries(isObj(m) ? m : {})
  .filter(([, v]) => Number.isInteger(v) && v >= 0));
/* A restored answer must be one the question could have produced:
   otherwise it is dropped and the question reopens for an unscored retry */
function lastOk(q, last){
  return q.type === "pick"  ? q.items.includes(last)
       : q.type === "mcq"   ? RULES.some(r => r.id === last)
       : q.type === "place" ? Number.isInteger(last) && last >= 0 && last <= q.shelf.length
       : Array.isArray(last) && last.every(id => typeof id === "string") &&
         [...last].sort().join() === [...q.tray].sort().join();
}
function cleanState(s){
  const st = freshState();
  if (VIEWS.includes(s.view)) st.view = s.view;
  // Records only for questions that exist, with known fields copied one by one.
  // A record counts as submitted only if it is consistent: a first result, and
  // for Test 3 one true/false per designated pair; otherwise only its hint is kept.
  for (const [qid, r] of Object.entries(isObj(s.q) ? s.q : {})){
    const q = QUESTION_BY_ID.get(qid);
    if (!q || !isObj(r)) continue;
    const rec = { first:null, hints: r.hints > 0 ? 1 : 0, attempts:0 };
    const pairsOk = q.type !== "order" || (Array.isArray(r.pairs) && r.pairs.length === q.pairs.length &&
      r.pairs.every(b => typeof b === "boolean"));
    if (Number.isInteger(r.attempts) && r.attempts > 0 && typeof r.first === "boolean" && pairsOk){
      Object.assign(rec, { first:r.first, attempts:r.attempts });
      if (lastOk(q, r.last)) rec.last = r.last;
      if (q.type === "order") rec.pairs = r.pairs.slice();
    }
    st.q[qid] = rec;
  }
  st.reveal = intMap(s.reveal);
  st.tq = intMap(s.tq);
  st.pq = intMap(s.pq);
  for (const [id, on] of Object.entries(isObj(s.started) ? s.started : {})) if (on === true) st.started[id] = true;
  for (const [id, on] of Object.entries(isObj(s.warm) ? s.warm : {})) if (on === true) st.warm[id] = true;
  return st;
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if (raw){
      const s = JSON.parse(raw);
      if (isObj(s)) return cleanState(s);
    }
  }catch(e){ /* private mode / file:// — fall through to fresh */ }
  return freshState();
}
/* A saved screen can't be ahead of what the saved answers unlock */
function clampView(){
  const f = frontier();
  if (VIEWS.indexOf(state.view) > f) state.view = VIEWS[f];
}
/* Can this browser save at all? (Blocked site data, some private modes: no.)
   The intro says so instead of promising saved progress. */
let storageOK = (() => {
  try{
    const k = STORE_KEY + "-check";
    localStorage.setItem(k, "1"); localStorage.removeItem(k);
    return true;
  }catch(e){ return false; }
})();
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){ storageOK = false; /* in-memory only */ }
}
function record(qid, firstCorrect, last, pairs){
  const r = state.q[qid] || (state.q[qid] = { first:null, hints:0, attempts:0 });
  r.attempts++;
  if (r.first === null){                                // first attempt only
    r.first = !!firstCorrect;
    if (pairs) r.pairs = pairs;                         // Test 3: each designated pair, first submit
  }
  if (last !== undefined) r.last = last;                // tests: last submitted answer, restored on return
  saveState();
  return r;
}
/* A hint counts once, and only if opened before the first submit: a hint on a
   retry (or after a results link) doesn't make the scored answer "needed help" */
function reqHint(qid){
  const r = state.q[qid] || (state.q[qid] = { first:null, hints:0, attempts:0 });
  if (r.hints === 0 && r.attempts === 0){ r.hints = 1; saveState(); }
  return r.hints;
}
function query(qid){
  return state.q[qid] || { first:null, hints:0, attempts:0 };
}
/* Submitted at least once: opening a hint creates a record, but doesn't answer */
function answered(qid){ return !!state.q[qid] && state.q[qid].attempts > 0; }
/* The correct answer to a question, derived (never authored for tests):
   a lesson pick, a Test 1 part, a Test 2 gap, a Test 3 shelf order */
const placeAnswer = q => q.shelf.filter(id => compare(CALLNOS[id], CALLNOS[q.tray]) < 0).length;
function rightAnswer(q){
  return q.type === "pick" ? q.correct : q.type === "mcq" ? t1Answer(q)
       : q.type === "place" ? placeAnswer(q) : byShelf(q.tray);
}
/* Lessons and tests move on only once a question is answered correctly (it
   locks then), so a wrong answer can't unlock the next question, lesson or
   test; retries are unlimited and only the first submit is scored */
function solved(q){
  if (!answered(q.id)) return false;
  const last = query(q.id).last, right = rightAnswer(q);
  return q.type === "order" ? Array.isArray(last) && last.join() === right.join() : last === right;
}
/* Scored observations of a question: Tests 1–2 give one, tagged by the
   question; a Test 3 set gives one per designated pair, tagged by the pair.
   ok = right on the first submission (null = not yet answered). */
function observations(q){
  const r = query(q.id);
  if (q.type !== "order") return [{ tag:q.tag, ok:r.first }];
  return q.pairs.map((p, k) => ({ tag:p.tag, ok:r.pairs ? r.pairs[k] : null }));
}
/* Which rules settle a question, derived, never authored: Test 2 — the
   book against each neighbour of its correct slot; Test 3 — the two designated
   pairs. One rule = "apply one rule" (LO3), more than one = "combine rules"
   (LO4); Test 1 = "spot the deciding line" (LO2). Gives 6 / 6 / 6. */
function rulesOf(q){
  if (q.type === "order") return new Set(q.pairs.map(p => ruleOf(p.tag).id));
  if (q.type === "place"){
    const T = CALLNOS[q.tray], gap = placeAnswer(q);
    const L = CALLNOS[q.shelf[gap - 1]], R = CALLNOS[q.shelf[gap]];
    return new Set([L && firstDiffer(L, T).key, R && firstDiffer(T, R).key]
      .filter(Boolean).map(k => ruleOf(k).id));
  }
  return new Set([ruleOf(q.tag).id]);
}
const outcomeOf = q => q.type === "mcq" ? "spot" : rulesOf(q).size > 1 ? "combine" : "apply";

/* ---------- Small helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");   // safe in text and attributes
/* Text of an HTML string, parsed in an inert document (nothing in it runs) */
const stripHtml = s => new DOMParser().parseFromString(s, "text/html").body.textContent;
/* Which part of the call number each rendered line is. Line 1 = letters,
   line 2 = number, then Cutters (letter + digits, may repeat), then date/other. */
const ROLE_LABEL = { letters:"Letter line", number:"Number line", cutter:"Cutter number", date:"Date line" };
/* What to highlight: a whole line (a role) or part of the Cutter line */
const LIGHT_LABEL = { letters:"Letter line", number:"Number line", cutter:"Cutter number",
                      cutterLetter:"Cutter number's letter", cutterDecimal:"Cutter number's numbers", date:"Date line" };
const CUTTER_PART = { cutterLetter:1, cutterDecimal:2 };   // regex group to light
const TAG_LIGHT = { letters:"letters", wholeNumber:"number", cutterLetter:"cutterLetter",
                    cutterDecimal:"cutterDecimal", dateVolume:"date" };
function lineRoles(cn){
  return cn.lines.map((l, i) => i === 0 ? "letters" : i === 1 ? "number"
    : /^[A-Z]+\d+$/.test(l) ? "cutter" : "date");
}
/* The line key's name for line i: "1st/2nd Cutter number" only on labels
   with more than one Cutter; copy and volume lines by name */
function lineName(cn, roles, i){
  const r = roles[i], k = roles.slice(0, i).filter(x => x === "cutter").length;
  return r === "cutter" && roles.filter(x => x === "cutter").length > 1 ? ORD[k] + " Cutter number"
    : r === "date" && /^c\./.test(cn.lines[i] || "") ? "Copy line"
    : r === "date" && /^v\./.test(cn.lines[i] || "") ? "Volume line" : ROLE_LABEL[r];
}
/* Where a missing line's empty slot goes: a date at the end, a further
   Cutter after the last Cutter line */
const missingAt = (cn, role) => role === "date" ? cn.lines.length : lineRoles(cn).lastIndexOf("cutter") + 1;
/* What a screen reader hears for a (possibly part-blanked) spine. named = say
   each line's name too, where the line key is on screen (lessons, Test 1) */
function spineSpeech(cn, show, named, missing){
  if (cn.warm) return "Book " + cn.lines[0];   // warm-up books are numbered, not call numbers
  const roles = lineRoles(cn);
  // A Cutter is read one character at a time ("E 2 4 4"), never as a whole
  // number ("E two hundred forty-four"), which is the reading the lessons correct
  // Line names as the key shows them, counting a missing line's empty slot ("1st Cutter number")
  const at = missing ? missingAt(cn, missing) : -1;
  const keyLines = at < 0 ? cn.lines : [...cn.lines.slice(0, at), "", ...cn.lines.slice(at)];
  const keyRoles = at < 0 ? roles : [...roles.slice(0, at), missing, ...roles.slice(at)];
  const shownLines = cn.lines.map((l, i) => [l, roles[i], i]).filter(([, r]) => !show || show.includes(r));
  const seen = shownLines.map(([l, r, i]) => (named ? lineName({ lines:keyLines }, keyRoles, at >= 0 && i >= at ? i + 1 : i)
      .toLowerCase().replace("cutter", "Cutter") + " " : "") + (r === "cutter" ? [...l].join(" ") : l));
  const hidden = cn.lines.length - seen.length;
  if (missing){                  // the empty slot, said in its place: "no date", "no second Cutter number"
    seen.splice(shownLines.filter(([, , i]) => i < at).length, 0,
      missing === "date" ? "no date" : "no " + ORDW[roles.filter(r => r === "cutter").length + 1] + " Cutter number");
  }
  return "Call number: " + seen.join(", ") +
    (hidden ? ", followed by " + hidden + (hidden === 1 ? " line" : " lines") + " not covered yet" : "");
}
/* opt: { light, dim, labels, show, sweep, at, marks }.
   at (optional) = index of the one line to light, for labels with repeated
   Cutters; without it every line of the lit role is lit.
   light is a role (whole line) or cutterLetter / cutterDecimal (part of it).
   marks = [{ light, at }, …] lights several lines at once (Test 2);
   light/at is shorthand for one mark.
   show lists the roles taught so far; other lines render as blank bars that
   keep the label's shape.
   missing ("date" or "cutter") adds an empty dashed slot where that line would
   be, so a call number without it can sit beside one with it, lines level, and
   the slot be lit as the line that decides ("nothing is shelved before something"). */
function spineHTML(cn, opt){
  opt = opt || {};
  const gap = opt.missing ? missingAt(cn, opt.missing) : -1;
  const lines = gap < 0 ? cn.lines : [...cn.lines.slice(0, gap), "", ...cn.lines.slice(gap)];
  const roles = gap < 0 ? lineRoles(cn) : [...lineRoles(cn).slice(0, gap), opt.missing, ...lineRoles(cn).slice(gap)];
  const shown = r => !opt.show || opt.show.includes(r);
  const marks = opt.marks || (opt.light ? [{ light:opt.light, at:opt.at }] : []);
  // What is lit on line i: 0 none, 1 Cutter letter, 2 Cutter numbers, 3 whole line
  const litAt = (r, i) => marks.reduce((acc, m) => {
    const part = CUTTER_PART[m.light] || 0;
    if ((part ? "cutter" : m.light) !== r || (m.at !== undefined && m.at !== i)) return acc;
    return acc | (part || 3);
  }, 0);
  const isLit = (r, i) => litAt(r, i) > 0;
  const cls = (r, i) => !marks.length ? "" : litAt(r, i) === 3 ? " lit" : isLit(r, i) ? "" : opt.dim ? " dim" : "";
  const text = (l, r, i) => {
    const part = litAt(r, i), m = (part === 1 || part === 2) && CUTTER_RE.exec(l);
    if (!m) return esc(l);
    return part === 1 ? `<span class="lit">${esc(m[1])}</span>${esc(m[2])}`
                      : `${esc(m[1])}<span class="lit">${esc(m[2])}</span>`;
  };
  const litNames = [...new Set(marks.map(m => LIGHT_LABEL[m.light]))];
  const label = spineSpeech(cn, opt.show, opt.labels, opt.missing) +
    (litNames.length ? ". " + litNames.join(" and ") + " highlighted" : "");
  const line = (l, i) => i === gap ? `<span class="spine-line none ${roles[i]}${cls(roles[i], i)}"></span>`
    : shown(roles[i])
    ? `<span class="spine-line${cls(roles[i], i)}">${text(l, roles[i], i)}</span>`
    : `<span class="spine-line blank"><span class="blank-bar" style="width:${Math.max(2, l.length)}ch"></span></span>`;
  const spine = `<span class="spine${opt.sweep ? " sweep" : ""}" role="img" aria-label="${esc(label)}">` +
    lines.map(line).join("") + `</span>`;
  if (!opt.labels) return spine;
  return `<span class="spine-wrap"><span class="spine-labels" aria-hidden="true">` +
    roles.map((r, i) => {                  // key row: name + connector pointing at the line
      const lit = isLit(r, i), on = shown(r), name = lineName({ lines }, roles, i);
      return `<span class="key${lit ? " lit" : ""}${on ? "" : " empty"}">` +
        `<span>${on ? name : ""}</span><i class="conn"></i></span>`;
    }).join("") +
    `</span>${spine}</span>`;
}
/* Uniform label size for call numbers shown together: CSS custom
   properties read by the .uniform rules */
function sizeStyle(cns){
  const lines = Math.max(...cns.map(c => c.lines.length));
  const chars = Math.max(...cns.flatMap(c => c.lines.map(l => l.length)));
  return `--cn-lines:${lines};--cn-chars:${chars}`;
}
const reduceMotion = () => !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
/* Messages sent in the same moment (feedback, then "Test 2 done") are read as one */
let pendingLive = "";
function announce(msg){
  const live = $("#live");
  if (!live) return;
  if (pendingLive){ pendingLive += " " + msg; return; }
  pendingLive = msg;
  live.textContent = "";
  requestAnimationFrame(() => { live.textContent = pendingLive; pendingLive = ""; });
}

/* ---------- Completion ---------- */
function allModulesDone(){
  return MODULES.every(m => m.practice.every(solved));
}
function moduleDone(id){          // M0 has no practice: done once its last step is shown
  const m = modById(id);
  return m.practice.length ? m.practice.every(solved)
                           : (state.reveal[id] || 0) >= m.steps.length - 1;
}
function testDone(id){            // every question answered correctly (first try or later)
  return testById(id).questions.every(solved);
}
function testAt(t){               // index of the question showing (one at a time)
  return Math.min(state.tq[t.id] || 0, t.questions.length - 1);
}
function canAdvance(v){
  if (v === "intro") return true;
  if (v.startsWith("m")) return moduleDone(v);
  if (v.startsWith("t")) return testDone(v);
  return false;
}
function nextOf(v){
  const i = VIEWS.indexOf(v);
  if (v === "intro") return "m0";
  if (v === "m5")    return allModulesDone() ? "t1" : "m5";
  if (i >= 0 && i + 1 < VIEWS.length) return VIEWS[i + 1];
  return v;
}

/* ---------- View dispatch ---------- */
function go(v){
  if (v !== state.view) setHash(v, true);   // a new screen is a browser history entry
  state.view = v;
  saveState();
  render();
}
/* Browser history: one entry per screen ("#m3", "#t2"; the intro has no hash), so
   the browser's Back (or a tablet's swipe-back) goes to the previous screen.
   The saved state stays the source of truth: the hash only follows it. */
const viewHash = v => v === "intro" ? "" : "#" + v;
function setHash(v, push){
  if (typeof history === "undefined" || typeof location === "undefined" || !history.replaceState) return;
  if (location.hash === viewHash(v)) return;
  const url = viewHash(v) || location.pathname + location.search;
  try{ history[push ? "pushState" : "replaceState"]({ view:v }, "", url); }catch(e){ /* history unavailable */ }
}
function render(){
  wireShell();
  const v = state.view;
  if (overview && overview !== v) overview = null;           // leaving a test closes its reopened intro card
  $("#view").className = v === "intro" || v.startsWith("m") ? "narrow" : "";
  if (v === "intro")          renderIntro();
  else if (v.startsWith("m")) renderRevealModule(modById(v));
  else if (v.startsWith("t")) renderTest(testById(v));
  else if (v === "results")   renderResults();
  renderShell();
  setHash(v, false);                                  // keep the address in step without a new entry
  document.title = pageTitle(v);
  // Focus the screen's heading, so a screen reader announces where the learner is
  document.activeElement && document.activeElement.blur && document.activeElement.blur();
  const h1 = $("#view").querySelector("h1");
  if (h1){ h1.setAttribute("tabindex", "-1"); h1.focus({ preventScroll:true }); }
  else $("#view").focus({ preventScroll:true });
  window.scrollTo(0, 0);
}
/* Browser tab title per screen: "Lesson 2: The number line · Call Number Tutorial" */
const SITE_TITLE = "Call Number Tutorial";
function pageTitle(v){
  const name = v === "intro" ? "" : v === "results" ? "Your results" : v === "m0" ? "Introduction"
             : v.startsWith("m") ? `Lesson ${v.slice(1)}: ${modById(v).title}` : `Test ${v.slice(1)}`;
  return name ? `${name} · ${SITE_TITLE}` : SITE_TITLE;
}
function goBack(){
  const i = VIEWS.indexOf(state.view);
  go(VIEWS[Math.max(0, i - 1)]);
}

/* ---------- Shell: outline, sidebar, top bar, drawer ----------
   Back lives in the shell. There is no Next in the
   shell: the forward control appears in the content when the view is
   complete (forwardHTML). The outline navigates to reached steps only. */
function viewTitle(v){
  if (v === "intro")   return "Start here";
  if (v === "results") return "Your results";
  if (v.startsWith("m")) return modById(v).title;
  return testById(v).title;
}
function shortName(v){           // "Lesson 3", "Test 2", "your results"
  if (v === "results") return "your results";
  if (v === "m0") return "the introduction";
  if (v.startsWith("m")) return "Lesson " + v.slice(1);
  return "Test " + v.slice(1);
}
/* Outline entry: lessons and tests stack a small "Lesson 3" / "Test 1" label
   above their title (the results screen and page header refer to them by number) */
function outlineLabelHTML(v){
  const stack = (kicker, title) => `<span class="ol-kicker">${esc(kicker)}<span class="sr">:</span></span>${esc(title)}`;
  if (v === "m0" || !/^[mt]\d/.test(v)) return esc(viewTitle(v));
  if (v.startsWith("m")) return stack("Lesson " + v.slice(1), modById(v).title);
  return esc(shortName(v));      // tests: just "Test 1"
}
function frontier(){             // index of the furthest view the learner has reached
  let i = 0;
  while (i < VIEWS.length - 1 && canAdvance(VIEWS[i]) && nextOf(VIEWS[i]) !== VIEWS[i]) i++;
  return i;
}
function viewStatus(v){          // "now" | "done" | "open" (reached, not complete) | "locked"
  if (v === state.view) return "now";
  const i = VIEWS.indexOf(v);
  if (i > frontier()) return "locked";
  return v !== "results" && canAdvance(v) ? "done" : "open";
}
function viewProgress(v){        // live position, shown under the current outline item
  if (v.startsWith("m")){
    const m = modById(v), at = revealAt(m), n = m.steps.length, np = m.practice.length;
    if (moduleDone(v) && (!np || at >= n)) return "Done";
    if (at >= n) return np > 1 ? "Practice: question " + (practiceAt(m) + 1) + " of " + np : "Practice";
    return n + " steps";
  }
  if (v.startsWith("t")) return canAdvance(v) ? "Done" : "";   // the question number lives on the card
  return "";
}
function positionLabel(v){       // "Lesson 3 of 5"; tests carry their number in the title
  if (v === "m0") return "";                 // the introduction is not numbered
  if (v.startsWith("m")) return "Lesson " + v.slice(1) + " of 5";
  return "";
}
/* Why the locked items are locked: the first view the learner hasn't finished */
function lockReason(){
  const b = VIEWS[frontier()];
  if (b === "m0") return "finish the introduction";
  if (b === "m5" && moduleDone(b)) return "finish the practice in every lesson";
  if (b.startsWith("m")) return "finish the practice in " + shortName(b);
  if (b.startsWith("t")) return "answer every question in " + shortName(b) + " correctly";
  return "finish " + shortName(b);
}
const CROSS = `<svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true">` +
  `<path d="M1.5 1.5l7 7M8.5 1.5l-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
const PADLOCK = `<svg class="ol-lock" viewBox="0 0 12 14" width="12" height="14" aria-hidden="true">` +
  `<path d="M3.5 6V4.3a2.5 2.5 0 0 1 5 0V6" fill="none" stroke="currentColor" stroke-width="1.6"/>` +
  `<rect x="1" y="6" width="10" height="7.5" rx="1.6" fill="currentColor"/></svg>`;
function outlineHTML(){
  return `<ol class="outline">` + VIEWS.map(v => {
    const st = viewStatus(v), sub = st === "now" ? viewProgress(v) : "";
    const label = outlineLabelHTML(v) + (sub ? `<span class="ol-sub">${esc(sub)}</span>` : "");
    const item = st === "locked"     // padlock instead of a dot; the reason is read out
      ? `<span class="ol-item">${label}<span class="sr"> (locked: ${esc(lockReason())})</span></span>`
      : `<button type="button" class="ol-item" data-go="${v}"${st === "now" ? ' aria-current="step"' : ""}>` +

}
/* Back names where it goes ("← Lesson 5"), so in a test it can't be mistaken

function backLabel(v){

function closeOutline(restoreFocus){
  const d = $("#drawer");
  if (d.hidden) return;

let shellWired = false;
function wireShell(){            // once: delegated clicks for shell + forward controls
  if (shellWired) return;
  shellWired = true;
  document.addEventListener("click", e => {
    const t = e.target.closest("[data-go], [data-act]");
    if (!t || t.disabled) return;
    if (t.dataset.go){ closeOutline(false); go(t.dataset.go); return; }
    const a = t.dataset.act;
    if (a === "back") goBack();
    else if (a === "outline") openOutline();
    else if (a === "close-outline") closeOutline(true);
    else if (a === "next-q") goQuestion(1);
    else if (a === "prev-q") goQuestion(-1);
    else if (a === "next-p") goPractice(1);
    else if (a === "prev-p") goPractice(-1);
    else if (a === "start-test") startTest(testById(state.view), true);
    else if (a === "end-warm") endWarm(testById(state.view));
    else if (a === "print") window.print();
    else if (a === "open-q") openQuestion(t.dataset.test, +t.dataset.i);
  });
  // Outline drawer is a modal dialog: Escape closes, Tab stays inside
  $("#drawer").addEventListener("keydown", e => {
    if (e.key === "Escape"){ e.preventDefault(); closeOutline(true); return; }
    if (e.key !== "Tab") return;
    const f = [...$("#drawer .drawer-panel").querySelectorAll("button, a[href]")];
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  });
  window.addEventListener("resize", () => document.querySelectorAll(".shelf-scroll > .shelf2").forEach(edgeCue));
  // The tutorial open in two tabs: when the other tab saves, take its progress
  // and redraw, so neither tab overwrites the other with stale answers
  // (key null = storage cleared; a removed key loads as a fresh start)
  window.addEventListener("storage", e => {
    if (e.key !== STORE_KEY && e.key !== null) return;
    closeOutline(false);
    state = loadState();
    clampView();
    render();
    announce("Updated with progress from another tab.");
  });
  // Skip link: move focus without adding a "#view" history entry
  $(".skip").addEventListener("click", e => { e.preventDefault(); $("#view").focus(); });
  // Browser Back / Forward (or an edited address): show that screen, never one
  // that isn't unlocked yet. Other hashes (the skip link's #view) are ignored.
  window.addEventListener("popstate", () => {
    const v = location.hash.slice(1) || "intro";
    if (!VIEWS.includes(v) || v === state.view) return;
    closeOutline(false);
    state.view = v;
    clampView();
    saveState();
    render();
  });
  // The drawer only exists in the top-bar layout; close it if the layout changes
  if (window.matchMedia){
    const mq = window.matchMedia("(min-width:1100px)");
    const onChange = () => {
      if (!mq.matches || $("#drawer").hidden) return;
      closeOutline(false);
      focusQuiet("#view h1") || focusQuiet("#view");
    };
    mq.addEventListener ? mq.addEventListener("change", onChange) : mq.addListener(onChange);
  }
}
