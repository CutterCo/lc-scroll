/* ---------- Lessons: every step on one page ----------
   Each step is a numbered part: its caption, then its own picture (spines
   or a drawing). Below the last step, "Try it yourself" shows the practice
   card; the introduction has no practice, and its Next unlocks Lesson 1.
   A completed lesson opens with its practice showing. */
function revealEnd(m){                      // steps.length = practice showing; M0 stops at its last step
  return m.practice.length ? m.steps.length : m.steps.length - 1;
}
function revealAt(m){
  const r = state.reveal[m.id];
  if (r === undefined) return moduleDone(m.id) ? revealEnd(m) : 0;
  return Math.min(r, revealEnd(m));
}
function stepPictureHTML(m, st){
  if (st.visual) return `<div class="stage">${VISUALS[st.visual]()}</div>`;
  const sweepBtn = st.sweep && !reduceMotion()      // plays the top-down reading on demand
    ? `<button type="button" class="sweep-btn"><span aria-hidden="true">▶</span> Show me</button>` : "";
  return `<div class="stage">` + st.items.map((id, i) => spineHTML(CALLNOS[id],
      { light:st.light, at:st.at, dim:st.dim, labels:st.labels && i === 0, show:m.showLines, sweep:st.sweep,
        missing:(st.missing || {})[id] })).join("") + sweepBtn + `</div>`;
}
function renderRevealModule(m){
  const at = revealAt(m), n = m.steps.length, end = revealEnd(m), hasP = m.practice.length > 0;
  const parts = m.steps.map((st, i) =>
    `<div class="part"><span class="part-n" aria-hidden="true">${i + 1}</span>` +
    `<div class="part-body"><p class="caption" data-step="${i}"><span class="sr">Step ${i + 1}. </span>${st.text}</p>` +
    stepPictureHTML(m, st) + `</div></div>`).join("");
  // Below the steps: the button that shows the practice (or, in the introduction, moves on);
  // then the practice card once it shows
  const label = hasP ? esc(m.steps[n - 1].next || "Try it yourself") : esc("Next: " + modById(nextOf(m.id)).title + " →");
  const more = at < end
    ? `<div class="bar start"><button type="button" id="btn-reveal" class="primary">${label}</button></div>`
    : !hasP ? ""
    : `<section class="card">
         <h2 id="practice-head" tabindex="-1">Practice</h2>
         ${practiceCardHTML(m)}</section>`;
  // Forward control appears in the content once the module is complete
  const fwd = at < end ? "" : `<div id="forward">${forwardHTML(m.id)}</div>`;

  $("#view").innerHTML = `<div>
      ${positionLabel(m.id) ? `<p class="meta">${esc(positionLabel(m.id))}</p>` : ""}
      <h1>${esc(m.title)}</h1>
      ${parts}${more}${fwd}</div>`;

  const sb = $(".stage .sweep-btn");
  if (sb) sb.addEventListener("click", () => {
    const sp = sb.parentNode.querySelector(".spine.sweep");
    sp.classList.remove("play");
    void sp.offsetWidth;                                       // restart the sweep on every click
    sp.classList.add("play");
    announce("Read from the top: " + [...sp.querySelectorAll(".spine-line")].map(l => l.textContent).join(", then ") + ".");
  });
  const rb = $("#btn-reveal");
  if (rb) rb.addEventListener("click", () => {
    state.reveal[m.id] = end;
    saveState();
    if (!hasP){ go(nextOf(m.id)); return; }                   // the introduction: done, on to Lesson 1
    renderRevealModule(m);
    renderShell();
    const h = $("#practice-head");
    h.focus({ preventScroll:true });
    h.scrollIntoView({ block:"start", behavior: reduceMotion() ? "auto" : "smooth" });
  });
  if (hasP && at >= n) wirePracticeCard(m);
}

/* ---------- Radio group (lesson picks, Test 1 options): click or Enter/Space
   selects, arrow keys move and select, Escape clears. onSelect(value|null). */
function wireRadio(btns, onSelect){
  function select(b, focus){
    btns.forEach(x => {
      const on = x === b;
      x.classList.toggle("selected", on);
      x.setAttribute("aria-checked", on ? "true" : "false");
      x.tabIndex = on || (!b && x === btns[0]) ? 0 : -1;
    });
    if (focus && b) b.focus();
    onSelect(b ? b.dataset.choice : null);
  }
  btns.forEach((b, i) => {
    b.addEventListener("click", () => select(b));
    b.addEventListener("keydown", e => {
      const dir = e.key === "ArrowRight" || e.key === "ArrowDown" ? 1
                : e.key === "ArrowLeft" || e.key === "ArrowUp" ? -1 : 0;
      if (dir){ e.preventDefault(); select(btns[(i + dir + btns.length) % btns.length], true); }
      else if (e.key === "Escape"){ select(null); b.focus(); }
    });
  });
  return select;
}

/* ---------- Pick-the-spine practice: tap a book, then Submit ----------
   Spines are a radio group (arrow keys move, Enter/Space select, Escape
   clears). Feedback annotates the spines: the deciding line is lit, tying
   lines fade, and on a correct answer each book gets its shelf position.
   Marks fade in once per Submit, in the same half second as a lesson step. */
/* Lesson practice, one question at a time like the tests: "Question n of N"
   with plain progress dashes (unscored: done / current), Next once correct,
   Previous from question 2; the last pick is saved and restored */
const practiceAt = m => Math.min(state.pq[m.id] || 0, m.practice.length - 1);
/* A question's navigation, split for the action row: { l, r }. Previous goes
   left; on the right, once the question is answered correctly, Next question.
   Once the whole lesson or test is done, every question's right-hand button is
   the way out (exit), and Next question moves left. */
function navParts(prev, act, i, n, ok, exit){
  const more = i + 1 < n, nextQ = cls => `<button type="button"${cls} data-act="next-${act}">Next question →</button>`;
  if (exit) return { l:prev + (more ? nextQ("") : ""), r:exit };
  return { l:prev, r:ok && more ? nextQ(' class="primary"') : "" };
}
function practiceNavHTML(m, i){
  const prev = i > 0 ? `<button type="button" data-act="prev-p">← Previous question</button>` : "";
  return navParts(prev, "p", i, m.practice.length, solved(m.practice[i]), exitButton(m.id));
}
/* The action row. extra = more tools after Hint (Return to tray) */
function actionsHTML(nav, extra){
  return `<div class="actions">
      <div class="act-l"><span class="nav-l">${nav.l}</span><button type="button" class="hint-btn">Hint</button>${extra || ""}</div>
      <div class="act-r"><button type="button" class="primary submit-btn" aria-disabled="true">Submit</button><span class="nav-r">${nav.r}</span></div>
    </div>`;
}
function setNav(section, nav){
  section.querySelector(".nav-l").innerHTML = nav.l;
  section.querySelector(".nav-r").innerHTML = nav.r;
}
function practiceHeadHTML(m, i){
  if (m.practice.length < 2) return "";
  const bars = m.practice.map((q, k) =>
    `<span class="${k === i ? "now" : solved(q) ? "done" : ""}"></span>`).join("");
  return `<div class="q-head"><h3 class="meta" id="pq-head-${m.id}" tabindex="-1">Question ${i + 1} of ${m.practice.length}</h3>
    <div class="q-bars plain" aria-hidden="true">${bars}</div></div>`;
}
function practiceCardHTML(m){
  const i = practiceAt(m);
  return `<div class="p-card">${practiceHeadHTML(m, i)}${pickHTML(m.practice[i], m.showLines, practiceNavHTML(m, i), i === 0)}</div>`;
}
function wirePracticeCard(m){
  const i = practiceAt(m), q = m.practice[i], section = $(`[data-qid="${q.id}"]`), wasDone = moduleDone(m.id);
  wirePick(section, q, () => {
    setNav(section, practiceNavHTML(m, i));
    const h = $(".p-card .q-head");
    if (h) h.outerHTML = practiceHeadHTML(m, i);
    updateProgress(m.id, wasDone);
    focusAction(section);
  }, m.showLines);
}
function goPractice(step){
  const m = modById(state.view);
  state.pq[m.id] = Math.max(0, Math.min(m.practice.length - 1, practiceAt(m) + step));
  saveState();
  const card = $(".p-card");
  card.outerHTML = practiceCardHTML(m);
  wirePracticeCard(m);
  renderShell();                       // the outline shows the practice question number
  const h = $(`#pq-head-${m.id}`);
  if (h){ h.focus({ preventScroll:true }); h.scrollIntoView({ block:"nearest", behavior: reduceMotion() ? "auto" : "smooth" }); }
}
function pickHTML(q, show, nav, first){   // the how-to line on a lesson's first question only
  return `<section class="question" data-qid="${q.id}">
    <p class="prompt">${esc(q.prompt)}</p>
    ${first ? `<p class="sub">Select a book, then select Submit.</p>` : ""}
    <div class="pair picks" role="radiogroup" aria-label="${esc(q.prompt)}">
      ${q.items.map((id, i) => `<button type="button" class="pick" role="radio" aria-checked="false"
          tabindex="${i === 0 ? 0 : -1}" data-choice="${id}"
          aria-label="${esc(spineSpeech(CALLNOS[id], show))}">
          <span class="badge" aria-hidden="true"></span>${spineHTML(CALLNOS[id], { show })}</button>`).join("")}
    </div>
    <div class="hint-slot"></div>
    <div class="feedback-slot"></div>
    ${actionsHTML(nav)}
  </section>`;
}
function wirePick(section, q, afterSubmit, show){
  const slot = section.querySelector(".feedback-slot");
  const picks = [...section.querySelectorAll(".pick")];
  const submitBtn = section.querySelector(".submit-btn");
  const order = byShelf(q.items);
  let chosen = null, marked = false, done = false;   // done: correct, locked

  function paint(opt, withBadges, fadeIn){
    picks.forEach(b => {
      const id = b.dataset.choice;
      b.querySelector(".spine").outerHTML = spineHTML(CALLNOS[id], Object.assign({ show }, opt));
      if (fadeIn) b.querySelector(".spine").classList.add("marking");
      const badge = b.querySelector(".badge");
      badge.textContent = withBadges ? ORD[order.indexOf(id)] : "";
      badge.classList.toggle("marking", !!(fadeIn && withBadges));
    });
  }
  function clearMarks(){         // the marks go; the feedback text stays, without its verdict
    paint({}, false);
    staleFeedback(slot);
    marked = false;
  }
  const select = wireRadio(picks, v => {
    const changed = v !== chosen;
    chosen = v;
    if (marked && changed) clearMarks();
    setSubmit(submitBtn, !!chosen && !done);
  });
  const closeHint = wireHint(section, q);
  // restore = redraw the saved pick, no new record or announcement
  function result(restore){
    const ok = chosen === q.correct;
    if (!restore) record(q.id, ok, chosen);
    const d = firstDiffer(CALLNOS[order[0]], CALLNOS[order[1]]);
    // Always point at the deciding line; shelf positions only once correct
    paint({ light:d && TAG_LIGHT[d.key], at:d && d.at, dim:true }, ok, !restore);
    marked = true;
    if (ok){                                  // lock once correct, like the tests
      done = true;
      picks.forEach(b => { b.disabled = true; });
      submitBtn.hidden = true;
      section.querySelector(".hint-btn").hidden = true;
    }
    const msg = ok ? q.feedback.correct
                   : (q.feedback.incorrect[chosen] || "Compare the lines from the top down.");
    // Module practice is unscored: no first-try language here
    const said = showStamp(slot, q, ok, msg);
    if (restore) return;
    announce(said);
    if (afterSubmit) afterSubmit();
  }
  submitBtn.addEventListener("click", () => {
    if (!chosen && !done) announce("Select a book first.");
    if (!chosen || done) return;
    closeHint();
    result(false);
  });
  const last = picks.find(b => b.dataset.choice === query(q.id).last);
  if (last){ select(last); result(true); }
}

/* ---------- Tests: one question card at a time ----------
   Card header "Question n of N" with progress bars (first try / needed help /
   current / upcoming). Tests never highlight before an answer: finding the
   deciding line is the skill. "Next question →" appears in the action row once
   the question is answered correctly; once every question is, each question
   leads out of the test there, and the header shows the first-try score. */
function qHeadHTML(t, i){
  const bars = t.questions.map((q, k) => {
    const f = query(q.id).first;
    return `<span class="${k === i ? "now" : f === true ? "first" : f === false ? "help" : ""}"></span>`;
  }).join("");
  const rs = t.questions.map(q => query(q.id).first), yes = rs.filter(f => f === true).length, no = rs.filter(f => f === false).length;
  const sofar = yes + no ? `<span class="sr">. So far: ${yes} right on the first try, ${no} not.</span>` : "";
  const score = testDone(t.id) ? `<span class="q-score">${firstTry(t)}</span>` : "";   // once the test is done
  return `<div class="q-head"><p class="meta" id="q-head-${t.id}" tabindex="-1">Question ${i + 1} of ${t.questions.length}${sofar}</p>
    <div class="q-right">${score}<div class="q-bars" aria-hidden="true">${bars}</div></div></div>`;
}
/* Question navigation for the action row: Previous from question 2 on;
   Next once this question has been answered correctly (navParts) */
function qNavHTML(t, i){
  // Q1 always goes back to the intro card, so every question has a way back
  const prev = `<button type="button" data-act="prev-q">${i > 0 ? "← Previous question" : "← Test overview"}</button>`;
  return navParts(prev, "q", i, t.questions.length, solved(t.questions[i]), exitButton(t.id));
}
/* Intro card: the test's heading as title, a why paragraph, then
   Results / Length / Next. Shown before Q1 until Start; "← Test overview" on Q1
   comes back here. Answered questions mean the test has started, whatever was
   saved; after that the card is only reopened as a reference (`overview`, not
   saved: leaving the screen or a reload goes back to the questions). */
const testAnswered = t => t.questions.some(q => answered(q.id));
let overview = null;             // id of a started test whose intro card is reopened
const showIntro = t => overview === t.id || (!state.started[t.id] && !testAnswered(t));
function testIntroHTML(t){
  const nx = nextOf(t.id), next = nx === "results" ? "Your results" : shortName(nx);
  return `<section class="card t-intro compact${t.wideCard ? " wide-card" : ""}" aria-labelledby="t-intro-h">
    <p class="meta">${esc(shortName(t.id))}</p>
    <h1 id="t-intro-h" tabindex="-1">${esc(t.questions[0].prompt)}</h1>
    <p class="t-task">${esc(t.introCard.why)}</p>
    <dl class="t-facts">${WARMUPS[t.id] ? `
      <div><dt>First</dt><dd>A quick practice round to learn the controls. Not scored.</dd></div>` : ""}
      <div><dt>Results</dt><dd>Your first try on each question shows you what to work on next. Answer each question correctly to move on.</dd></div>
      <div><dt>Length</dt><dd>${t.questions.length} questions</dd></div>
      <div><dt>Next</dt><dd>${esc(next)}</dd></div>
    </dl>
    <div class="bar start"><button type="button" class="primary" data-act="start-test">${testAnswered(t) ? "Back to the questions" : "Start test"}</button></div>
  </section>`;
}
function renderTest(t){
  if (showIntro(t)){ $("#view").innerHTML = testIntroHTML(t); return; }
  if (showWarm(t)){ renderWarm(t); return; }
  const i = testAt(t), q = t.questions[i];
  const [html, wire] = q.type === "mcq" ? [mcqHTML, wireMCQ] : q.type === "place" ? [placeHTML, wirePlace] : [orderHTML, wireOrder];
  $("#view").innerHTML = html(t, q, i);
  const section = $(`[data-qid="${q.id}"]`), wasDone = testDone(t.id);
  wire(section, q, () => {
    setNav(section, qNavHTML(t, i));
    section.querySelector(".q-head").outerHTML = qHeadHTML(t, i);
    updateProgress(t.id, wasDone);
    focusAction(section);
  });
}
/* Warm-up card: after Start test, before Question 1, until done or skipped.
   Once Question 1 has an answer it is never shown again */
const showWarm = t => !!WARMUPS[t.id] && !state.warm[t.id] && !testAnswered(t);
const warmHeadHTML = t => `<div class="q-head"><p class="warm-badge">${esc(shortName(t.id))} practice · Not scored</p>
    <button type="button" class="link warm-skip" data-act="end-warm">Skip to Question 1</button></div>`;
/* The warm-up's steps as a numbered strip; each ticks once the learner has done it */
const warmStepsHTML = (q, done) => `<ol class="warm-steps">${q.steps.map((st, i) => {
  const on = done.has(i), now = !on && [...q.steps.keys()].find(k => !done.has(k)) === i;
  return `<li class="${on ? "done" : now ? "now" : ""}"><span class="ws-n" aria-hidden="true">${on ? "✓" : i + 1}</span>` +
    `${esc(st)}${on ? `<span class="sr"> (done)</span>` : ""}</li>`; }).join("")}</ol>`;
function warmNavHTML(done){
  return { l:`<button type="button" data-act="prev-q">← Test overview</button>`,
           r:done ? `<button type="button" class="primary" data-act="end-warm">Start Question 1 →</button>` : "" };
}
function renderWarm(t){
  const q = WARMUPS[t.id];
  const [html, wire] = q.type === "place" ? [placeHTML, wirePlace] : [orderHTML, wireOrder];
  $("#view").innerHTML = html(t, q, 0);
  const section = $(`[data-qid="${q.id}"]`);
  // Tick the steps as they happen, read from the controls after each click (sticky)
  const done = new Set(), last = q.steps.length - 1;
  const strip = () => { section.querySelector(".warm-steps").outerHTML = warmStepsHTML(q, done); };
  section.querySelector(".sub").insertAdjacentHTML("afterend", warmStepsHTML(q, done));
  wire(section, q, () => {                         // after each Submit; right: the way on replaces Skip
    const ok = !!section.querySelector(".stamp--correct");
    setNav(section, warmNavHTML(ok));
    section.querySelector(".warm-skip").hidden = ok;
    focusAction(section);
  });
  // Registered after the controls' own listener, so it reads the updated controls
  section.addEventListener("click", e => {
    const has = sel => !!section.querySelector(sel);
    if (has(".book.selected") || has('[data-k="placed"]') || has(".slots .book")) done.add(0);
    if (has('[data-k="placed"]') || has(".slots .book")) done.add(1);
    if (q.type === "order" && e.target.closest('[data-k="back"], .return-btn, .clear-btn')) done.add(2);
    if (has(".stamp, .note.last")) done.add(last);
    strip();
  });
}
function endWarm(t){
  state.warm[t.id] = true;
  state.tq[t.id] = 0;
  saveState();
  render();
  focusQuiet(`#q-head-${t.id}`);
}
function goQuestion(step){
  const t = testById(state.view);
  if (step < 0 && testAt(t) === 0){                    // back to the intro card
    if (!testAnswered(t)){ startTest(t, false); return; }
    overview = t.id;                                   // a started test: reopened, not saved
    render();
    focusQuiet("#t-intro-h");
    return;
  }
  state.tq[t.id] = Math.max(0, testAt(t) + step);
  saveState();
  render();
  focusQuiet(`#q-head-${t.id}`);
}
/* Focus without scrolling; a missing target is skipped, never an error */
function focusQuiet(sel){
  const el = $(sel);
  if (el) el.focus({ preventScroll:true });
  return !!el;
}
/* Results → a missed test question: opens it with the last answer restored;
   if it was never answered correctly the learner can retry (unscored) */
function openQuestion(testId, i){
  state.started[testId] = true;
  state.tq[testId] = i;
  if (testId !== state.view) setHash(testId, true);
  state.view = testId;
  saveState();
  render();
  focusQuiet(`#q-head-${testId}`);
}
function startTest(t, on){
  overview = null;
  state.started[t.id] = on;
  if (on) state.tq[t.id] = 0;
  saveState();
  render();
  focusQuiet(on ? `#q-head-${t.id}` : "#t-intro-h");
}

/* ---------- Multiple choice (Test 1): the four parts as a radio group ---------- */
/* The four parts are the four results lines (RULES): the Cutter's letter and
   numbers are one choice here, as on the results screen */
const T1_CHOICES = RULES.map(r => ({ v:r.id, label:r.label }));
const t1Answer = q => ruleOf(firstDiffer(CALLNOS[q.items[0]], CALLNOS[q.items[1]]).key).id;   // derived
/* Test feedback is written per question: `correct`, or for Test 1
   `wrong` keyed by the chosen part. Tests 2–3 wrong answers: t2Wrong / t3Wrong */
const testFeedback = (q, ok, chosen) => ok ? q.feedback.correct : q.feedback.wrong[chosen];

/* Generated wrong-answer copy, Tests 2–3. Feedback wording only: the
   ordering logic is compare() / firstDiffer(), unchanged. A part is named
   without its letter/numbers detail ("the second Cutter number decides"). */
const partName = d => d.name.replace(/'s (letter|numbers)$/, "");
const T2_WRONG = {
  first:  "A book only goes first if it belongs before its neighbour. Compare it with {book}; the {part} decides.",
  last:   "A book only goes last if it belongs after its neighbour. Compare it with {book}; the {part} decides.",
  middle: "A book only fits in a slot if it belongs between both neighbours. Compare it with {book}; the {part} decides.",
};
const T3_WRONG = "Compare {a} and {b}; the {part} decides.";
/* Only the first out-of-order pair is marked; this says so, so the unmarked
   books don't read as right */
const T3_SCOPE = "Start with this pair, the first from the left that's out of order. Others may be out too.";
const fillIn = (text, v) => text.replace(/\{(\w+)\}/g, (m, k) => v[k] !== undefined ? esc(v[k]) : m);
/* Test 2, wrong gap g (0 = before the first book): the slot's trap copy, or the
   template naming the one neighbour it fails against (the shelf is in order,
   so exactly one side fails: too early → the book to its right, else left). */
function t2Wrong(q, g){
  if (q.feedback.traps[g + 1]) return q.feedback.traps[g + 1];
  const T = CALLNOS[q.tray], shelf = q.shelf.map(id => CALLNOS[id]);
  const R = shelf[g], fail = R && compare(T, R) > 0 ? R : shelf[g - 1];
  const at = g === 0 ? "first" : g === shelf.length ? "last" : "middle";
  return fillIn(T2_WRONG[at], { book:cnText(fail), part:partName(firstDiffer(T, fail)) });
}
/* Test 3, wrong order: the first out-of-order neighbours, named shelf-first
   (a = the book that belongs first); trap copy if they match a trap */
function t3Wrong(q, placed){
  const j = placed.findIndex((id, m) => m + 1 < placed.length && compare(CALLNOS[id], CALLNOS[placed[m + 1]]) > 0);
  const a = placed[j + 1], b = placed[j];
  const trap = q.feedback.traps.find(t => (t.book === a && t.partners.includes(b)) || (t.book === b && t.partners.includes(a)));
  const msg = trap ? fillIn(trap.text, { partner:cnText(CALLNOS[trap.book === a ? b : a]) })
                   : fillIn(T3_WRONG, { a:cnText(CALLNOS[a]), b:cnText(CALLNOS[b]), part:partName(firstDiffer(CALLNOS[a], CALLNOS[b])) });
  return { msg, flag:[b, a] };
}
function mcqHTML(t, q, i){
  const opts = T1_CHOICES.map((c, k) =>
    `<button type="button" class="opt" role="radio" aria-checked="false" tabindex="${k === 0 ? 0 : -1}"
       data-choice="${c.v}"><span class="opt-dot" aria-hidden="true"></span>${esc(c.label)}</button>`).join("");
  return `<section class="question card uniform${cardCls(t)}" data-qid="${q.id}" style="${sizeStyle(q.items.map(id => CALLNOS[id]))}">
    ${qHeadHTML(t, i)}
    ${promptHTML(q, q.id + "-prompt")}
    <div class="stage">${q.items.map((id, k) =>
      `<span class="t-spine" data-id="${id}">${spineHTML(CALLNOS[id], { labels:k === 0 })}</span>`).join("")}</div>
    <div class="opts" role="radiogroup" aria-labelledby="${q.id}-prompt">${opts}</div>
    <div class="hint-slot"></div>
    <div class="feedback-slot"></div>
    ${actionsHTML(qNavHTML(t, i))}
  </section>`;
}
function wireMCQ(section, q, afterSubmit){
  const slot = section.querySelector(".feedback-slot");
  const spines = [...section.querySelectorAll(".t-spine")];
  const submitBtn = section.querySelector(".submit-btn");
  const hintBtn = section.querySelector(".hint-btn");
  const order = byShelf(q.items);
  let chosen = null, marked = false, done = false;   // done: answered correctly, locked

  // Spines are marked (deciding line lit, ties dimmed) only after a correct answer
  function paint(opt, fadeIn){
    spines.forEach((w, k) => {
      w.innerHTML = spineHTML(CALLNOS[w.dataset.id], Object.assign({ labels:k === 0 }, opt));
      if (fadeIn) w.querySelector(".spine").classList.add("marking");
    });
    marked = !!opt.light;
  }
  const opts = [...section.querySelectorAll(".opt")];
  const select = wireRadio(opts, v => {
    if (v !== chosen) staleFeedback(slot);         // a different part: keep the advice, drop the verdict
    chosen = v;
    setSubmit(submitBtn, !!chosen && !done);
  });
  const closeHint = wireHint(section, q);            // one hint per question, toggles
  // Once correct, the question locks like Tests 2–3: the answer, the lit line
  // and the feedback stay; a later wrong answer can't replace them
  function lock(){
    done = true;
    opts.forEach(b => { b.disabled = true; });
    submitBtn.hidden = true; hintBtn.hidden = true;
  }
  // Show the result of the chosen answer; restore = redraw the last submitted answer, unscored
  function result(restore){
    const ok = chosen === t1Answer(q);
    if (ok) lock();
    if (!restore) record(q.id, ok, chosen);
    const d = firstDiffer(CALLNOS[order[0]], CALLNOS[order[1]]);
    if (ok) paint({ light:d && TAG_LIGHT[d.key], at:d && d.at, dim:true }, !restore);
    else if (marked) paint({});
    const said = showStamp(slot, q, ok, testFeedback(q, ok, chosen));
    if (restore) return;
    announce(said);
    if (afterSubmit) afterSubmit();
  }
  submitBtn.addEventListener("click", () => {
    if (!chosen && !done) announce("Select a line first.");
    if (chosen && !done){ closeHint(); result(false); }
  });
  const last = opts.find(b => b.dataset.choice === query(q.id).last);
  if (last){ select(last); result(true); }
}

/* ---------- Placement (Test 2) ----------
   Select the book to shelve, then a gap between the shelved books: it sits
   there provisionally. Select it again to move it to another gap; select its
   faded copy (or Return to tray) to take it back. Submit checks the gap
   against compare(). A wrong answer leaves the book where it was placed,
   tagged with a drawn cross, with that slot's feedback (text only, no
   highlighting). A correct answer lights the deciding line(s) against each
   neighbour. One hint.
   The shelf row scrolls sideways when 4 books + 5 gaps are wider than the card. */
/* The prompt is the page h1, with any method line under it; the card is
   compact (Tests 2–3 keep their full width for the shelf row) */
const cardCls = t => " compact" + (t.wideCard ? " wide-card" : "");
const WARM_SIZE = "--cn-lines:4;--cn-chars:4";   // warm-up books: the size of a short real label
const promptHTML = (q, id) =>
  `<h1 class="prompt"${id ? ` id="${id}"` : ""}>${esc(q.prompt)}</h1>` +
  (q.sub ? `<p class="sub">${esc(q.sub)}</p>` : "");
function placeHTML(t, q, i){
  const cns = [q.tray, ...q.shelf].map(id => CALLNOS[id]);
  // Lines longer than 5 characters (LB 1028.43): trimmed labels, so the shelf fits a tablet
  const trim = Math.max(...cns.flatMap(c => c.lines.map(l => l.length))) > 5 ? " trim" : "";
  return `<section class="question card uniform${trim}${cardCls(t)}${q.warm ? " warm" : ""}" data-qid="${q.id}" style="${q.warm ? WARM_SIZE : sizeStyle(cns)}">
    ${q.warm ? warmHeadHTML(t) : qHeadHTML(t, i)}
    ${promptHTML(q)}
    <div class="cart"><div class="cart-slot"></div>
      <div><p class="cart-title">Book to shelve</p><p class="cart-status" role="status"></p></div></div>
    <div class="shelf-scroll"><div class="shelf2" role="group" aria-label="Shelf, left to right"></div></div>
    <div class="hint-slot"></div>
    <div class="feedback-slot"></div>
    ${actionsHTML(q.warm ? warmNavHTML(false) : qNavHTML(t, i), `<button type="button" class="return-btn" disabled>Return to tray</button>`)}
  </section>`;
}
/* Fade the shelf row's edges where there is more shelf to scroll to */
function edgeCue(row){
  const w = row.parentElement, max = row.scrollWidth - row.clientWidth;
  w.classList.toggle("more-l", row.scrollLeft > 1);
  w.classList.toggle("more-r", row.scrollLeft < max - 1);
}
const hintPanel = q => `<div class="note hint"><p class="note-head">Hint</p><p class="note-body">${q.hints[0]}</p></div>`;
/* Hint toggle: "Hint" / "Hide hint", closed on every visit and on Submit;
   only the first open of a question counts as a hint used */
function wireHint(section, q){
  const btn = section.querySelector(".hint-btn"), slot = section.querySelector(".hint-slot");
  slot.id = "hint-" + q.id;
  btn.setAttribute("aria-controls", slot.id);
  const show = open => {
    slot.innerHTML = open ? hintPanel(q) : "";
    btn.textContent = open ? "Hide hint" : "Hint";
    btn.setAttribute("aria-expanded", open ? "true" : "false");
  };
  show(false);
  btn.addEventListener("click", () => {
    const open = btn.getAttribute("aria-expanded") !== "true";
    if (open) reqHint(q.id);
    show(open);
    if (open) announce("Hint: " + stripHtml(q.hints[0]));
  });

}
/* Status lines are live regions: rewrite only on a change, so nothing is re-announced */
const setStatus = (el, text) => { if (el.textContent !== text) el.textContent = text; };
/* Feedback stamp. Test 1 shelves nothing, so it says "Correct" */
const stampWord = (q, ok) => !ok ? "Not quite" : q.type === "mcq" ? "Correct" : "Shelved";
/* Draw the stamp; returns what a screen reader hears (the heading word, then the text) */
function showStamp(slot, q, ok, msg){
  if (ok && q.type !== "mcq") msg = "Correct! " + msg;   // under "Shelved"; Test 1's heading already says it
  slot.innerHTML = `<div class="stamp stamp--${ok ? "correct" : "incorrect"}">` +
    `<p class="stamp-head">${stampWord(q, ok)}</p><p class="stamp-body">${msg}</p></div>`;
  return stampWord(q, ok) + ". " + stripHtml(msg);
}
/* After a wrong answer, changing the answer keeps the advice but drops the
   verdict: the stamp becomes a plain note about the last answer, until the
   next Submit replaces it */
function staleFeedback(slot){
  const s = slot.querySelector(".stamp--incorrect");
  if (!s) return;
  s.outerHTML = `<div class="note last"><p class="note-head">Last answer</p>` +
    `<p class="note-body">${s.querySelector(".stamp-body").innerHTML}</p></div>`;
}
/* Submit stays focusable when it can't be used yet: greyed with aria-disabled */
const setSubmit = (btn, on) => btn.setAttribute("aria-disabled", on ? "false" : "true");
function wirePlace(section, q, afterSubmit){
  const T = CALLNOS[q.tray], shelf = q.shelf.map(id => CALLNOS[id]);
  const cart = section.querySelector(".cart-slot"), status = section.querySelector(".cart-status");
  const row = section.querySelector(".shelf2"), slot = section.querySelector(".feedback-slot");
  const hintBtn = section.querySelector(".hint-btn"), returnBtn = section.querySelector(".return-btn");
  const submitBtn = section.querySelector(".submit-btn");
  const answer = placeAnswer(q);   // derived, never authored
  let pos = null, sel = null, wrong = false, done = false, marks = null;   // wrong: the placed book was submitted there and is wrong

  const lowerFirst = t => t.charAt(0).toLowerCase() + t.slice(1);   // "between LB 1028…", not "lb 1028…"
  const gapLabel = g => g === 0 ? "Before " + cnText(shelf[0])
    : g === shelf.length ? "After " + cnText(shelf[g - 1])
    : "Between " + cnText(shelf[g - 1]) + " and " + cnText(shelf[g]);
  const book = (key, extra, label, opt) =>
    `<button type="button" class="book${extra}" data-k="${key}" aria-pressed="${extra.includes("selected")}"` +
    `${done ? " disabled" : ""} aria-label="${esc(label)}">` +
    (extra.includes(" flag") ? `<span class="flag-tag" aria-hidden="true">${CROSS}</span>`
      : extra.includes(" mine") ? `<span class="flag-tag mine" aria-hidden="true">Your book</span>` : "") +
    `${spineHTML(T, opt)}</button>`;

  function refresh(focusKey){
    const ae = document.activeElement;
    focusKey = focusKey || (ae && section.contains(ae) && ae.dataset.k) || "";
    cart.innerHTML = book("cart", (sel === "tray" ? " selected" : "") + (pos !== null ? " away" : ""),
      "Book to shelve: " + cnText(T) + (pos !== null ? ". On the shelf; select to take it back" : ""), {});
    let html = "";
    for (let g = 0; g <= shelf.length; g++){
      html += pos === g
        ? book("placed", (sel === "shelf" ? " selected" : "") + (done ? " correct" : wrong ? " flag" : " mine"),
            cnText(T) + ", placed " + lowerFirst(gapLabel(g)) + (wrong ? ", not here" : "") + (done ? "" : ". Select to move it"),
            done ? { marks:marks.T, dim:true } : {})
        : `<button type="button" class="gap${sel && !done ? " ready" : ""}" data-k="gap${g}"` +
          `${done ? " disabled" : ""} aria-label="${esc(gapLabel(g))}">` +
          `${sel && !done ? "+" : ""}</button>`;
      if (g < shelf.length)
        html += `<span class="shelved">${spineHTML(shelf[g], done && marks[g] ? { marks:marks[g], dim:true } : {})}</span>`;
    }
    row.innerHTML = html;
    setStatus(status, done ? "Shelved."
      : sel === "tray" ? "Now select the slot where it goes."      // "slot", as in the feedback
      : sel === "shelf" ? "Select another slot to move it."
      : pos !== null ? "On the shelf. Select it to move it, or select Submit."
      : "Select it to pick it up.");
    returnBtn.disabled = pos === null;
    returnBtn.hidden = submitBtn.hidden = done;           // once correct, only the way on
    hintBtn.hidden = done || !!q.warm;                    // no hint in a warm-up
    setSubmit(submitBtn, !done && pos !== null);
    const el = focusKey && section.querySelector(`[data-k="${focusKey}"]`);
    if (el && !el.disabled) el.focus({ preventScroll:true });
    edgeCue(row);
  }
  row.addEventListener("scroll", () => edgeCue(row), { passive:true });
  function clearWrong(){         // moving the book clears the mark; the text stays, without its verdict
    if (wrong){ wrong = false; staleFeedback(slot); }
  }
  function pickUp(where){
    sel = where;
    clearWrong();
  }
  section.addEventListener("click", e => {
    const b = e.target.closest("[data-k]");
    if (!b || b.disabled || done) return;
    const k = b.dataset.k;
    if (k === "cart"){
      if (pos !== null){ pos = null; pickUp("tray"); }        // take it back off the shelf, still selected
      else if (sel === "tray") sel = null;
      else pickUp("tray");
      refresh("cart");
    } else if (k === "placed"){
      if (sel === "shelf") sel = null; else pickUp("shelf");
      refresh("placed");
    } else if (sel){                                          // a gap: place or move the book here
      pos = Number(k.slice(3));
      sel = null;
      refresh("placed");
      // Focus doesn't scroll (it would jump the page), so bring the placed book into view
      section.querySelector('[data-k="placed"]').scrollIntoView({ block:"nearest", inline:"nearest",
        behavior: reduceMotion() ? "auto" : "smooth" });
      announce("Placed.");                                    // the focused book's label says where
    } else if (k.startsWith("gap")) announce("Select the book first, then a slot.");
  });
  section.addEventListener("keydown", e => {
    if (e.key === "Escape" && sel){ sel = null; refresh(); return; }
    if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && row.contains(document.activeElement)){
      const f = [...row.querySelectorAll("button:not(:disabled)")];
      const i = f.indexOf(document.activeElement);
      if (i === -1) return;
      e.preventDefault();
      f[(i + (e.key === "ArrowRight" ? 1 : -1) + f.length) % f.length].focus();
    }
  });
  returnBtn.addEventListener("click", () => { pos = null; sel = null; clearWrong(); refresh("cart"); announce("Returned to the tray."); });
  const closeHint = wireHint(section, q);
  function result(restore){       // restore = redraw the last submitted answer, unscored
    const ok = pos === answer;
    if (!restore && !q.warm) record(q.id, ok, pos);
    let msg;
    if (ok){
      done = true; sel = null;
      // Light the deciding line against each neighbour (marked only when correct)
      const L = shelf[pos - 1], R = shelf[pos], mk = d => ({ light:TAG_LIGHT[d.key], at:d.at });
      const dl = L && firstDiffer(L, T), dr = R && firstDiffer(T, R);
      marks = { T:q.warm ? [] : [dl, dr].filter(Boolean).map(mk) };   // warm-up: nothing to light
      if (L && !q.warm) marks[pos - 1] = [mk(dl)];
      if (R && !q.warm) marks[pos] = [mk(dr)];
      msg = testFeedback(q, true);
    } else {
      msg = q.warm ? q.feedback.wrong : t2Wrong(q, pos);      // trap for this slot, or generated
      wrong = true; sel = null;                               // the book stays where it was placed, tagged
    }
    const said = showStamp(slot, q, ok, msg);
    refresh("");                                             // focus moves to the action row after: one announcement, the feedback
    // The row may scroll: bring the placed book to the middle
    const mark = row.querySelector('[data-k="placed"]');
    if (mark){
      const rr = row.getBoundingClientRect(), mr = mark.getBoundingClientRect();
      row.scrollLeft += (mr.left + mr.width / 2) - (rr.left + rr.width / 2);
    }
    edgeCue(row);
    if (restore) return;
    announce(said);
    if (afterSubmit) afterSubmit();
  }
  submitBtn.addEventListener("click", () => {
    if (pos === null && !done) announce("Place the book on the shelf first.");
    if (pos !== null && !done){ closeHint(); result(false); }
  });
  const last = query(q.id).last;
  if (typeof last === "number" && last >= 0 && last <= shelf.length){ pos = last; result(true); }
  else refresh();
}

/* ---------- Ordering (Test 3) ----------
   Books start in the tray (fixed order). Select a book, then a numbered slot
   on the shelf; a filled slot swaps (the book already there goes back to the
   tray, or trades places with a shelf book). The tray holds only the books
   still in it, a returned book at the end; while a shelf book is lifted, a
   return slot follows them, and selecting it takes the book back. An empty tray is one line of text. Return to tray
   and Clear the shelf (a link by the Shelf label, from two books on) undo;
   Submit once every slot is full.
   Scored by the set's two designated pairs (relative order, first submit).
   Wrong: books stay; the first out-of-order neighbours are marked "Check pair"
   on the shelf, with trap or generated feedback about that pair; no
   lines lit. Correct: green outlines, no highlighting. */
function orderHTML(t, q, i){
  return `<section class="question card uniform${cardCls(t)}${q.warm ? " warm" : ""}" data-qid="${q.id}" style="${q.warm ? WARM_SIZE : sizeStyle(q.tray.map(id => CALLNOS[id]))}">
    ${q.warm ? warmHeadHTML(t) : qHeadHTML(t, i)}
    ${promptHTML(q)}
    <p class="cart-status" role="status"></p>
    <p class="row-label">Tray</p>
    <div class="tray3" role="group" aria-label="Tray"></div>
    <div class="row-head"><p class="row-label">Shelf</p><button type="button" class="link clear-btn" hidden>Clear the shelf</button></div>
    <div class="shelf2 slots" role="group" aria-label="Shelf, left to right"></div>
    <div class="hint-slot"></div>
    <div class="feedback-slot"></div>
    ${actionsHTML(q.warm ? warmNavHTML(false) : qNavHTML(t, i), `<button type="button" class="return-btn" disabled>Return to tray</button>`)}
  </section>`;
}
function wireOrder(section, q, afterSubmit){
  const n = q.tray.length;
  const answer = byShelf(q.tray);   // derived
  const trayRow = section.querySelector(".tray3"), slotRow = section.querySelector(".slots");
  const status = section.querySelector(".cart-status"), slot = section.querySelector(".feedback-slot");
  const hintBtn = section.querySelector(".hint-btn"), returnBtn = section.querySelector(".return-btn");
  const clearBtn = section.querySelector(".clear-btn"), submitBtn = section.querySelector(".submit-btn");
  const placed = new Array(n).fill(null);   // placed[k] = id in slot k
  let sel = null, done = false;              // sel = id of the lifted book
  let flag = null;                           // the two ids marked "Check pair" after a wrong submit
  const trayOrder = [...q.tray];             // tray display order: starts preset, a returned book goes last
  const toTrayEnd = id => { trayOrder.splice(trayOrder.indexOf(id), 1); trayOrder.push(id); };

  const where = id => placed.indexOf(id);    // slot index, or -1 in the tray
  const book = (key, id, cls, label, shelved) =>
    `<button type="button" class="book${cls}" data-k="${key}" aria-pressed="${sel === id}"` +
    `${done ? " disabled" : ""} aria-label="${esc(label)}">` +
    (shelved ? `<span class="flag-tag" aria-hidden="true">Check pair</span>` : "") +   // space kept, shown on .flag
    `${spineHTML(CALLNOS[id], {})}</button>`;

  function refresh(focusKey){
    const ae = document.activeElement;
    focusKey = focusKey || (ae && section.contains(ae) && ae.dataset.k) || "";
    // The tray holds only the books still in it (starting order, returned books last);
    // while a shelf book is lifted, a return slot follows them. Nothing left: one line of text
    const inTray = trayOrder.filter(id => where(id) === -1);
    const back = sel && where(sel) !== -1 && !done
      ? `<button type="button" class="gap ghost ready" data-k="back"
           aria-label="${esc("Return " + cnText(CALLNOS[sel]) + " to the tray")}"><span>Return to tray</span></button>` : "";
    trayRow.innerHTML = inTray.length || back
      ? inTray.map(id => book("t:" + id, id, sel === id ? " selected" : "", "In the tray: " + cnText(CALLNOS[id]))).join("") + back
      : `<p class="tray-empty">All the books are on the shelf.</p>`;
    slotRow.innerHTML = placed.map((id, k) => {
      const pos = "Position " + (k + 1) + " of " + n;
      const flagged = !!(flag && flag.includes(id));
      return id
        ? book("s" + k, id, (sel === id ? " selected" : "") + (done ? " correct" : "") + (flagged ? " flag" : ""),
            pos + ": " + cnText(CALLNOS[id]) + (flagged ? ". Check this pair" : "") + (done ? "" : ". Select to move it"), true)
        : `<button type="button" class="gap slot-n${sel && !done ? " ready" : ""}" data-k="s${k}"${done ? " disabled" : ""}
             aria-label="${esc(pos + ", empty")}"><span aria-hidden="true">${k + 1}</span></button>`;
    }).join("");
    const full = placed.every(Boolean);
    setStatus(status, done ? "Shelved in order."
      : sel && where(sel) === -1 ? "Now select a slot on the shelf."
      : sel ? "Select another slot to move it there, or Return to tray."
      : full ? "Every book is on the shelf. Select Submit, or move a book."
      : "Select a book in the tray, then a slot on the shelf.");
    returnBtn.disabled = !sel || where(sel) === -1;
    setSubmit(submitBtn, !done && full);
    returnBtn.hidden = submitBtn.hidden = done;           // once correct, only the way on
    hintBtn.hidden = done || !!q.warm;                    // no hint in a warm-up
    clearBtn.hidden = done || placed.filter(Boolean).length < 2;    // worth a control from two books on
    const el = focusKey && section.querySelector(`[data-k="${CSS.escape(focusKey)}"]`);
    if (el && !el.disabled) el.focus({ preventScroll:true });
  }
  function changed(){ staleFeedback(slot); flag = null; }   // any move clears the marks; the text stays, without its verdict
  section.addEventListener("click", e => {
    const b = e.target.closest("[data-k]");
    if (!b || b.disabled || done) return;
    const k = b.dataset.k;
    if (k === "back"){ returnSel(); return; }             // the tray's return slot, while a shelf book is lifted
    if (k.startsWith("t:")){                              // a tray book: lift it, or put it down
      const id = k.slice(2);
      sel = sel === id ? null : id;
      changed(); refresh(k); return;
    }
    const s2 = Number(k.slice(1)), occupant = placed[s2];
    if (!sel){                                           // nothing lifted: lift the book in this slot
      if (occupant){ sel = occupant; changed(); refresh(k); }
      else announce("Select a book first, then a slot.");
      return;
    }
    if (occupant === sel){ sel = null; refresh(k); return; }
    const from = where(sel);
    placed[s2] = sel;
    if (from !== -1) placed[from] = occupant;            // shelf to shelf: swap (or move into an empty slot)
    else if (occupant) toTrayEnd(occupant);              // tray to a full slot: its book goes back to the tray
    sel = null;
    // From the tray, keyboard focus goes on to the next book still in the tray
    const nextInTray = from === -1 && trayOrder.find(id => where(id) === -1);
    changed(); refresh(nextInTray ? "t:" + nextInTray : k);
    announce("Placed in position " + (s2 + 1) + ".");
  });
  section.addEventListener("keydown", e => {
    if (e.key === "Escape" && sel){ sel = null; refresh(); return; }
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    const rowEl = [trayRow, slotRow].find(r => r.contains(document.activeElement));
    if (!rowEl) return;
    const f = [...rowEl.querySelectorAll("button:not(:disabled)")], i = f.indexOf(document.activeElement);
    if (i === -1) return;
    e.preventDefault();
    f[(i + (e.key === "ArrowRight" ? 1 : -1) + f.length) % f.length].focus();
  });
  function returnSel(){          // the lifted shelf book goes back to the tray
    const at = sel ? where(sel) : -1;
    if (at === -1) return;
    const id = sel; placed[at] = null; sel = null; toTrayEnd(id);
    changed(); refresh("t:" + id); announce("Returned to the tray.");
  }
  returnBtn.addEventListener("click", returnSel);
  clearBtn.addEventListener("click", () => {
    placed.filter(Boolean).forEach(toTrayEnd);          // after the tray's books, in shelf order
    placed.fill(null); sel = null;
    changed(); refresh("t:" + trayOrder[0]); announce("All books returned to the tray.");
  });
  const closeHint = wireHint(section, q);
  function result(restore){       // restore = redraw the last submitted answer, unscored
    const ok = placed.every((id, k) => id === answer[k]);   // the set is finished only when all of it is right
    const pairOk = q.pairs.map(p => where(p.a) < where(p.b));   // scored: designated pairs, relative order
    if (!restore && !q.warm) record(q.id, pairOk.every(Boolean), [...placed], pairOk);
    let msg;
    if (ok){
      done = true; sel = null; flag = null;
      msg = testFeedback(q, true);
    } else {
      ({ msg, flag } = t3Wrong(q, placed));               // first out-of-order neighbours, trap or generated
      msg = q.warm ? q.feedback.wrong : msg + " " + esc(T3_SCOPE);
    }
    const said = showStamp(slot, q, ok, msg);
    refresh();
    if (restore) return;
    const marked = flag ? " Marked: " + flag.map(id => cnText(CALLNOS[id])).join(" and ") + "." : "";
    announce(said + marked);
    if (afterSubmit) afterSubmit();
  }
  submitBtn.addEventListener("click", () => {
    if (!done && !placed.every(Boolean)) announce("Put every book on the shelf first.");
    if (!done && placed.every(Boolean)){ closeHint(); result(false); }
  });
  const last = query(q.id).last;
  if (Array.isArray(last) && last.length === n && [...last].sort().join() === [...q.tray].sort().join()){
    last.forEach((id, k) => { placed[k] = id; });
    result(true);
  } else refresh();
}

/* ---------- Results: formative, learner-facing ---------- */
/* Learner-facing results copy */
const RESULTS_COPY = {
  score: (ok, n) => `${ok} of ${n} right on your first try`,
  // The close marks finishing, the same at any score; the first summary line
  // follows the review box (nothing missed or something to revisit)
  done: "You made it to the end of the shelf!",
  summaryClear:  "You got every question right on your first try! The next step is to practise with real books.",
  summaryMissed: "Nice job completing the tutorial! This is where your shelving skills start. Review your results below, then get ready to practise with real books.",
  reading: "You've learned the rules you'll use most. Every call number is read the same way: start at the top line, move down while the lines match, and let the first difference decide. The more books you shelve, the more automatic it becomes.",
  printWhat: "Call Number Tutorial: results",   // the printout says what it is, with or without a name
  sheetHead: "Call number review",
  sheet: {
    letters: "Shelved alphabetically",
    number:  "Shelved numerically; decimals as decimals",
    cutter:  "Shelved alphabetically by letter and numerically as a decimal number",
    date:    "Shelved by date",
  },
  sheetCheck: "Add a call number review page to the printout",
  name: "Name for your printout",
  review: "Worth another look",
  clear: "Nothing to revisit",
  clearLine: "You shelved every book in order.",
  // Review box: the questions missed on this line, and a tie note when lines tie
  // items: [{ t, i, ref:"Test 3, Question 5" }] → "Missed: Test 1, Question 3; Test 3, Question 5; plus 2 more."
  // `link` renders each reference as a bold link to the question
  missedQs: (items, more, link) => `Missed: ${items.map(link).join("; ")}${more ? `; plus ${more} more` : ""}.`,
  whyTie:   others => `It tied with ${others} for the most misses, so look at ${others.includes(" and ") ? "those" : "that"} next.`,
  // lines: [{ miss, n, name }] → "You also missed 2 of 2 on the date line, so look at that too."
  // Two or more: names only, so the sentence stays short; By line has the counts
  whyAlso:  lines => lines.length === 1
    ? `You also missed ${lines[0].miss} of ${lines[0].n} on ${lines[0].name}, so look at that too.`
    : `You also missed half or more on ${andList(lines.map(l => l.name))}, so look at those too.`,
  revisit:  name => `Revisit ${name}`,
  skillsHead: "By skill",
  outcomes: {
    spot:    { label:"Spot the deciding line", sub:"Test 1" },
    apply:   { label:"Apply one rule",         sub:"Tests 2–3: one line decides" },
    combine: { label:"Combine rules",          sub:"Tests 2–3: more than one line decides" },
  },
  linesHead: "By line",
  linesNote: n => `Some questions check more than one line, so these add up to more than ${n}.`,
  hints: (n, tests) => `You used ${n} hint${n === 1 ? "" : "s"} (${tests}). Those answers count, and it's worth knowing which ones needed help.`,
  shiftHead: "Before your first shift",
  shift: "When you are shelving, nothing will indicate when a book is out of order. If a call number looks tricky, ask a colleague for help.",
  print: "Print or save as PDF",
  restart: "Start over",
  confirm: "This clears all your answers. Print first if you want to keep them.",
  confirmYes: "Yes, start over",
};
const REVIEW_PRIORITY = ["cutter", "number", "letters", "date"];   // ties
/* Worth another look: the one line with the most misses (raw count
   of observations); ties by REVIEW_PRIORITY. The button opens the rule's first
   lesson (the Cutter number: Lesson 3). `items` are the questions missed on
   this line (up to 3, test order), `more` how many beyond those, `tie`
   names the tied lines, and `also` any other line missed at least half the
   time, so a weak line with few answers is never left unnamed.
   byRule rows: { r, ok, n, miss, mine:[observations with q] }. Pure (no DOM),
   so it can be tested on its own. Returns null when nothing was missed. */
const REVIEW_LIST_MAX = 3;
function reviewOf(byRule){
  const C = RESULTS_COPY, missed = byRule.filter(b => b.miss > 0);
  if (!missed.length) return null;
  const rank = b => REVIEW_PRIORITY.indexOf(b.r.id);
  const top = missed.slice().sort((a, b) => b.miss - a.miss || rank(a) - rank(b))[0];
  const tied = missed.filter(b => b !== top && b.miss === top.miss).sort((a, b) => rank(a) - rank(b));
  // One entry per question (a Test 3 question with a missed pair counts once), in test order
  const order = TESTS.flatMap(t => t.questions);
  const qs = [];
  top.mine.forEach(o => { if (o.ok !== true && !qs.includes(o.q)) qs.push(o.q); });
  qs.sort((a, b) => order.indexOf(a) - order.indexOf(b));
  // The first REVIEW_LIST_MAX questions as full references, each one link, then a count
  const items = qs.slice(0, REVIEW_LIST_MAX).map(q => {
    const t = TESTS.find(t => t.questions.includes(q)), i = t.questions.indexOf(q);
    return { t:t.id, i, ref:`${shortName(t.id)}, Question ${i + 1}` };
  });
  const more = Math.max(0, qs.length - REVIEW_LIST_MAX);
  const tie = tied.length ? C.whyTie(andList(tied.map(b => b.r.name))) : "";
  const weak = missed.filter(b => b !== top && !tied.includes(b) && b.miss * 2 >= b.n).sort((a, b) => rank(a) - rank(b));
  const also = weak.length ? C.whyAlso(weak.map(b => ({ miss:b.miss, n:b.n, name:b.r.name }))) : "";
  return { rule:top.r, ok:top.ok, n:top.n, lesson:top.r.lessons[0], button:C.revisit(top.r.name),
           items, more, tie, also };
}
const andList = a => a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + " and " + a[a.length - 1];
function renderResults(){
  const C = RESULTS_COPY;
  const scoreQs = TESTS.flatMap(t => t.questions);
  const obs = scoreQs.flatMap(q => observations(q).map(o => Object.assign(o, { q })));

  // By skill: whole questions, first try (Test 3: both designated pairs)
  const outcomes = ["spot", "apply", "combine"].map(k => {
    const qs = scoreQs.filter(q => outcomeOf(q) === k);
    return { k, ok:qs.filter(q => query(q.id).first === true).length, n:qs.length };
  });
  const qOk = outcomes.reduce((s, o) => s + o.ok, 0), qN = outcomes.reduce((s, o) => s + o.n, 0);

  // By line: observations grouped into four rules
  const byRule = RULES.map(r => {
    const mine = obs.filter(o => r.tags.includes(o.tag));
    const ok = mine.filter(o => o.ok === true).length;
    return { r, ok, n:mine.length, miss:mine.length - ok, mine };
  }).filter(b => b.n > 0);

  const top = reviewOf(byRule);
  let review;
  if (top){
    review = `<section class="r-review" aria-labelledby="r-review-h">
      <div><h2 class="r-eyebrow" id="r-review-h">${esc(C.review)}</h2>
        <p class="r-review-line">${esc(top.rule.label)}: ${top.ok} of ${top.n}</p>
        <p class="r-why">${C.missedQs(top.items, top.more, it =>
          `<button type="button" class="link" data-act="open-q" data-test="${it.t}" data-i="${it.i}">${esc(it.ref)}</button>`)}${top.tie ? " " + esc(top.tie) : ""}${top.also ? " " + esc(top.also) : ""}</p></div>
      <button type="button" data-go="${top.lesson}">${esc(top.button)}</button>
    </section>`;
  } else {
    review = `<section class="r-review clear" aria-labelledby="r-review-h">
      <div><h2 class="r-eyebrow" id="r-review-h">${esc(C.clear)}</h2>
        <p class="r-review-line">${esc(C.clearLine)}</p></div>
    </section>`;
  }

  const hinted = TESTS.map(t => ({ t:shortName(t.id), n:t.questions.reduce((s, q) => s + query(q.id).hints, 0) }))
    .filter(h => h.n > 0);
  const nHints = hinted.reduce((s, h) => s + h.n, 0);
  const date = new Date().toLocaleDateString(undefined, { day:"numeric", month:"long", year:"numeric" });
  const score = (ok, n) => `<td class="${ok === n ? "r-full" : "r-part"}">${ok} of ${n}</td>`;

  $("#view").innerHTML = `
    <section class="card results" aria-labelledby="results-h">
      <p class="r-print-who" aria-hidden="true"><span>${esc(C.printWhat)}<span id="r-print-name"></span></span><span class="r-print-date">${esc(date)}</span></p>
      <h1 id="results-h">${esc(C.done)}</h1>
      <div class="r-summary">${[top ? C.summaryMissed : C.summaryClear, C.reading].map(t => `<p class="r-lede">${esc(t)}</p>`).join("")}</div>
      <h2 class="r-score">${esc(C.score(qOk, qN))}</h2>
      ${review}
      <div class="r-cols">
        <div>
          <h2 class="r-col-h" id="r-skills-h">${esc(C.skillsHead)}</h2>
          <table class="r-table" aria-labelledby="r-skills-h">
            <tbody>${outcomes.map(o => `<tr>
              <th scope="row">${esc(C.outcomes[o.k].label)}<span class="r-sub">${esc(C.outcomes[o.k].sub)}</span></th>
              ${score(o.ok, o.n)}</tr>`).join("")}</tbody>
          </table>
        </div>
        <div>
          <h2 class="r-col-h" id="r-lines-h">${esc(C.linesHead)}</h2>
          <table class="r-table" aria-labelledby="r-lines-h">
            <tbody>${byRule.map(b => `<tr><th scope="row">${esc(b.r.label)}</th>${score(b.ok, b.n)}</tr>`).join("")}</tbody>
          </table>
          <p class="r-note">${esc(C.linesNote(qN))}</p>
        </div>
      </div>
      ${nHints ? `<p class="r-hints">${esc(C.hints(nHints, andList(hinted.map(h => h.t))))}</p>` : ""}
      <section class="r-shift" aria-labelledby="r-shift-h">
        <h2 id="r-shift-h">${esc(C.shiftHead)}</h2>
        <p>${esc(C.shift)}</p>
      </section>
      <div class="r-print">
        <div class="r-who">
          <label for="r-name">${esc(C.name)}</label>
          <input id="r-name" type="text" autocomplete="off" maxlength="60">
        </div>
        <label class="r-check"><input type="checkbox" id="r-sheet-on" checked> ${esc(C.sheetCheck)}</label>
        <div class="r-actions" id="r-actions"></div>
      </div>
    </section>
    <section class="card results r-sheet" aria-labelledby="r-sheet-h">
      <h2 id="r-sheet-h">${esc(C.sheetHead)}</h2>
      <p class="r-lede">${esc(C.reading)}</p>
      <div class="r-sheet-row">
        <div class="stage">${spineHTML(CALLNOS.ps350m4, { labels:true })}</div>
        <ol class="r-sheet-list">${RULES.map(r => `<li><b>${esc(r.label)}</b> <span class="r-sheet-rule">${esc(C.sheet[r.id])}</span></li>`).join("")}</ol>
      </div>
    </section>`;
  // The printout shows the name after the tutorial's name on the top line
  const name = $("#r-name"), printName = $("#r-print-name");
  name.value = printName.textContent = printoutName;
  name.addEventListener("input", () => { printoutName = printName.textContent = name.value; });
  wireRestart($("#r-actions"));
}

/* Restart lives on the results screen only (not global: an at-will restart
   would let a learner wipe a first attempt mid-test). Two-step, in-page
   confirm instead of window.confirm(), swapped into the actions row;
   Cancel is focused by default, Escape or Cancel backs out. */
function wireRestart(area){
  const C = RESULTS_COPY;
  function showButtons(focus){
    area.innerHTML = `<button type="button" class="primary" data-act="print">${esc(C.print)}</button>
      <button type="button" id="btn-restart">${esc(C.restart)}</button>`;
    const b = $("#btn-restart");
    b.addEventListener("click", showConfirm);
    if (focus) b.focus();
  }
  function showConfirm(){
    area.innerHTML = `<div class="r-confirm">
      <p id="r-confirm-msg">${esc(C.confirm)}</p>
      <div class="bar start">
        <button type="button" id="btn-restart-no" aria-describedby="r-confirm-msg">Cancel</button>
        <button type="button" id="btn-restart-yes" class="danger">${esc(C.confirmYes)}</button>
      </div></div>`;
    $("#btn-restart-yes").addEventListener("click", resetProgress);
    $("#btn-restart-no").addEventListener("click", () => showButtons(true));
    area.querySelector(".r-confirm").addEventListener("keydown", e => {
      if (e.key === "Escape") showButtons(true);
    });
    $("#btn-restart-no").focus();   // safe default: the non-destructive choice
  }
  showButtons(false);
}
function resetProgress(){
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
  state = freshState();
  printoutName = "";
  render();
}

/* ---------- Boot ---------- */
state = loadState();
clampView();
render();
</script>
